<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/lib/three.min.js"></script>
    <script src="assets/lib/arreglos.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2B1652; }
      #root { width: 100%; height: 100%; position: relative; font-family: Nunito, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="48" data-width="1080" data-height="1920">
      <div id="film" class="clip" data-composition-id="film" data-composition-src="compositions/film.html"
           data-start="0" data-duration="48" data-track-index="0" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html"
           data-start="0" data-duration="48" data-track-index="4" data-track-kind="captions"
           data-width="1080" data-height="1920" style="z-index:4"></div>
      <audio id="mezcla" class="clip" src="assets/audio/mezcla.wav" data-start="0" data-duration="48" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
