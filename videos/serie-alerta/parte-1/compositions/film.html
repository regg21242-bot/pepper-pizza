      { a: 11.3, b: 14.6, K: [[11.3, ...cerca(.3, .15)], [14.6, ...cerca(.255, .12)]] },

        [18.6, [1.5, 5.8, -9], [-1, 3, -32], Y], [21.4, [-.5, 6.6, -24], [-2, 3, -50], Y]] },

    TOMAS.forEach(s => { s.cp = new THREE.CatmullRomCurve3(s.K.map(k => V3(...k[1])), false, 'centripetal'); s.cl = new THREE.CatmullRomCurve3(s.K.map(k => V3(...k[2])), false, 'centripetal'); if (s.K.length < 2) s.K.push(s.K[0]); });

    /* ---------- miniaturas de las tarjetas A/B (se toman una vez al cargar) ---------- */

    const luzFoto = new THREE.PointLight('#E8F0FF', 0, 6, 1.5); scene.add(luzFoto);

    function carta(x, y, k, hl, letra, col, titulo, img) { if (k <= 0) return; X.save(); X.globalAlpha = Math.min(1, k); X.translate(x, y); const s = .9 + .1 * Math.min(1, k) + .06 * hl; X.scale(s, s);

        const ks = prog(t, T.sigueme, T.sigueme + .4) * o; if (ks > 0) { X.globalAlpha = ks; rr(290, 1390, 500, 90, 45); X.fillStyle = 'rgba(255,255,255,.12)'; X.fill(); text('Parte 2 →', 540, 1437, 46, '#FFFFFF'); X.globalAlpha = 1; } } }

      C.cel.pantalla(est, { bril, bat, brillo: bril }); C.alarma(t, alarm * (t < 1 || t >= T.loop ? 1 : 1)); C.rojoL.intensity *= t < 13.3 || t >= T.loop ? 1 : 0;
