    // cámara del mundo: escala y centro

      fx = lerp(lt < 1.1 ? 820 : lt < 2.2 ? r.share.x : (st.avatar ? st.avatar(0)[0] : 540), tgt[0], k); fy = lerp(lt < 1.1 ? 1700 : lt < 2.2 ? r.share.y : (st.avatar ? st.avatar(0)[1] : 1200), tgt[1], k);
      for (const tt of [.85, 1.95, 2.95]) if (lt > tt && lt < tt + .3) tap = 1 - (lt - tt) / .3;

    }

    /* tiempos (de la voz). mezcla.py lee T */
    const T = { cuts: [3.9, 8.7, 12.3, 17.8, 23.2, 27.3, 31.7, 36.7, 40.3], end: 45.6,

    let camS = { cx: 540, cy: 900, z: 1 };
    const scr = (x, y) => [W / 2 + (x - camS.cx) * camS.z, H / 2 + (y - camS.cy) * camS.z];
    function cama(t, cx, cy, z, o = {}) { camS = { cx, cy, z }; return escenaCama(t, 0, Object.assign({ cx, cy, z }, o)); }

      const pts = [[300, 520, 0], [780, 700, 1.7], [700, 430, 3.1], [260, 820, 4.4]].slice(0, n);

        if (toward) { const kk = toward.k; x = lerp(x, toward.x + Math.cos(i * 2) * 70, kk * .45); y = lerp(y, toward.y + Math.sin(i * 2) * 70, kk * .45); a = lerp(a, Math.atan2(toward.x - x, -(toward.y - y)), kk); }

    }
    const SC = [
      { a: 0, b: C[0], f: (t, lt) => { cama(t, 540, 900, 1.0 + lt * .03, { mosq: t > T.posa }); if (t < T.posa + .2) mosquitosVolando(t, 1); return { badge: 'mito' }; } },
      { a: C[0], b: C[1], f: (t, lt) => { const k = ease(prog(lt, 0, 4.6)); cama(t, 540, lerp(900, 680, k), lerp(1.12, 2.0, k), { mosq: true }); mosquitosVolando(t, 3, 1); return { badge: t > T.azucar ? 'cero' : 'mito', tach: prog(t, T.noCierto, T.noCierto + .35) }; } },
      { a: C[1], b: C[2], f: (t, lt) => { cama(t, 540, 1000, lerp(.92, .85, prog(lt, 0, 3.6)), { mosq: true }); mosquitosVolando(t, 2); return { comp: prog(t, T.comp, T.comp + .3) }; } },
      { a: C[2], b: C[3], f: (t, lt) => escenaMosquito(t, lt) },
      { a: C[3], b: C[4], f: (t, lt) => { const P = cama(t, 540, 760, lerp(1.0, .9, prog(lt, 0, 5.4))); const k = ease(prog(lt, .3, 1.2));
          const L = []; for (const [txt, tt, ang, r] of [['aliento', T.aliento, -2.2, 330], ['calor', T.calor, -.6, 400], ['olor de piel', T.olor, 1.9, 470]]) if (t > tt) L.push([txt, tt, P.cara[0] + Math.cos(ang) * r, P.cara[1] + 60 + Math.sin(ang) * r]);
          anillosMujer(t, k, [90, 220, 255], L, P); mosquitosVolando(t, 2, .9); return { ringLabels: L, P }; } },
      { a: C[4], b: C[5], f: (t, lt) => { const P = cama(t, 540, 760, lerp(.9, .95, prog(lt, 0, 4))); const red = ease(prog(t, T.rojo, T.rojo + .6));
          const col = [lerp(90, 255, red), lerp(220, 46, red), lerp(255, 99, red)];
          anillosMujer(t, 1, col, [], P); mosquitosVolando(t, 3, 1, { x: P.cara[0], y: P.cara[1], k: ease(prog(lt, .6, 3.5)) });
          return { ringLabels: [['te encontró', T.rojo + .4, P.cara[0] + 300, P.cara[1] - 260]], red: true }; } },
      { a: C[5], b: C[6], f: (t, lt) => { const k = ease(prog(lt, 0, 4.4)); const P = cama(t, 540, lerp(760, 712, k), lerp(1.3, 2.6, k)); camara(camS.cx, camS.cy, camS.z); MT.aliento(c, P.boca[0], P.boca[1] - 10, ease(prog(lt, .3, 1)), t); c.setTransform(1, 0, 0, 1, 0, 0); mosquitosVolando(t, 2, 1);
          return { ringLabels: t > T.co2 ? [['CO2', T.co2, P.boca[0] + 40, P.boca[1] + 170]] : [] }; } },
      { a: C[6], b: C[7], f: (t, lt) => { cama(t, 540, 900, .95); c.fillStyle = 'rgba(8,10,14,.55)'; c.fillRect(0, 0, W, H); return { ticket: prog(t, T.ticket, T.ticket + .35) }; } },
      { a: C[7], b: C[8], f: (t, lt) => { const P = cama(t, 540, 860, lerp(.95, 1.05, prog(lt, 0, 3.6))); anillosMujer(t, 1, [255, 46, 99], [], P); return { badge: 'mito', tach: prog(t, T.tacha, T.tacha + .4) }; } },

    function escenaCelular2(t, lt) {
      c.setTransform(1, 0, 0, 1, 0, 0);
      const g = c.createRadialGradient(540, 900, 100, 540, 900, 1100); g.addColorStop(0, '#2A2F3A'); g.addColorStop(1, '#101216'); c.fillStyle = g; c.fillRect(0, 0, W, H);
      const st = { hoja: ease(prog(t, T.compartir + .15, T.compartir + .55)), sel: t > T.contacto + .1 ? 0 : -1, enviado: t > T.enviar + .1 ? 1 : 0 };
      const zIn = lerp(1.6, 1, ease(prog(lt, 0, .7)));
      c.save(); c.translate(540, 900); c.scale(zIn, zIn); c.translate(-540, -900);
      const r = MT.celular(c, W, H, t, (cc) => { MT.recamara(cc, t); MT.mosquito(cc, 385, 1060, 1.7, -.4, t, {}); MT.vineta(cc, W, H, .7); }, st);

      const pts = [[860, 1750], [r.share.x, r.share.y], st.avatar ? st.avatar(0) : [r.share.x, r.share.y], st.botonEnviar || [540, 1400]];
      const times = [T.compartir - .7, T.compartir, T.contacto, T.enviar];
      let i = 0; while (i < 3 && t > times[i + 1]) i++;
      const k = i < 3 ? ease(prog(t, times[i + 1] - .55, times[i + 1])) : 1; const a = pts[i], b = pts[Math.min(i + 1, 3)];
      let tap = 0; for (const tt of times.slice(1)) if (t > tt && t < tt + .3) tap = 1 - (t - tt) / .3;
      if (lt > .5) MT.dedo(c, lerp(a[0], b[0], k), lerp(a[1], b[1], k) + 40, 1, tap);
      MT.vineta(c, W, H, .5);

      const g = sc.f(t, lt) || {};

      const bl = i > 0 ? Math.max(0, 1 - lt / .5) : 0; cv.style.filter = bl > 0 ? `blur(${26 * bl * bl}px)` : 'none'; cv.style.transform = `scale(${1 + .08 * bl})`;
      // badge

        badge.innerHTML = badges[bk]() + (g.tach > 0 ? `<div class="tach" style="transform: rotate(-8deg) scaleX(${g.tach})"></div>` : ''); badge.style.opacity = k > 0 ? 1 : 0; badge.style.transform = `scale(${.5 + .5 * backOut(k)})`; } else badge.style.opacity = 0;

    }
