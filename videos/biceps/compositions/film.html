    /* ---------- utilidades ---------- */
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

    /* grano fino */
    const grain = document.createElement('canvas'); grain.width = 540; grain.height = 960;
    (function () { const g = grain.getContext('2d'), im = g.createImageData(540, 960), r = rng(11); for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); })();
    function finish(t, vign) {

    }

    /* =================== EL BRAZO =================== */
    const SKIN = { hi: '#E7B48C', mid: '#C88660', lo: '#8C5135' };
    const ARM = (() => {
      const p = new Path2D();
      p.moveTo(-80, 830);
      p.bezierCurveTo(10, 770, 120, 760, 190, 820);
      p.bezierCurveTo(250, 720, 470, 690, 600, 790);
      p.bezierCurveTo(650, 830, 680, 880, 700, 905);
      p.bezierCurveTo(690, 800, 690, 690, 705, 600);
      p.bezierCurveTo(640, 560, 640, 430, 700, 380);
      p.bezierCurveTo(760, 330, 880, 340, 915, 410);
      p.bezierCurveTo(950, 470, 935, 545, 905, 590);
      p.bezierCurveTo(930, 760, 960, 920, 935, 1080);
      p.bezierCurveTo(925, 1150, 870, 1190, 800, 1195);

    })();
    /* la piel se pinta una sola vez en una capa aparte (lo más pesado del cuadro) */
    const skinCv = document.createElement('canvas'); skinCv.width = W; skinCv.height = H;
    (function paintSkin() {
      const keep = ctx; ctx = skinCv.getContext('2d');
      ctx.save(); ctx.clip(ARM);
      const g = ctx.createLinearGradient(0, 700, 0, 1230); g.addColorStop(0, SKIN.hi); g.addColorStop(.45, SKIN.mid); g.addColorStop(1, SKIN.lo);
      ctx.fillStyle = g; ctx.fillRect(-100, 300, 1200, 1000);
      soft(() => { ctx.fillStyle = 'rgba(255,225,190,0.75)'; ctx.beginPath(); ctx.ellipse(420, 820, 170, 70, -.1, 0, 7); ctx.fill(); }, 45);
      soft(() => { ctx.fillStyle = 'rgba(255,215,180,0.55)'; ctx.beginPath(); ctx.ellipse(800, 760, 70, 260, .05, 0, 7); ctx.fill(); }, 40);
      soft(() => { ctx.fillStyle = 'rgba(255,220,185,0.6)'; ctx.beginPath(); ctx.ellipse(790, 430, 110, 70, -.3, 0, 7); ctx.fill(); }, 30);
      soft(() => { ctx.fillStyle = 'rgba(70,30,15,0.75)'; ctx.beginPath(); ctx.ellipse(690, 930, 60, 120, -.4, 0, 7); ctx.fill(); }, 35);
      soft(() => { ctx.fillStyle = 'rgba(70,30,15,0.55)'; ctx.beginPath(); ctx.ellipse(420, 1180, 520, 80, 0, 0, 7); ctx.fill(); }, 50);
      soft(() => { ctx.fillStyle = 'rgba(70,30,15,0.45)'; ctx.beginPath(); ctx.ellipse(200, 870, 50, 120, .3, 0, 7); ctx.fill(); }, 35);
      soft(() => { ctx.fillStyle = 'rgba(70,30,15,0.5)'; ctx.beginPath(); ctx.ellipse(925, 800, 40, 320, 0, 0, 7); ctx.fill(); }, 30);
      soft(() => { ctx.lineWidth = 150; ctx.strokeStyle = 'rgba(70,28,12,0.55)'; ctx.stroke(ARM); }, 45);
      ctx.save(); ctx.translate(0, 18); soft(() => { ctx.lineWidth = 40; ctx.strokeStyle = 'rgba(255,226,196,0.45)'; ctx.stroke(ARM); }, 16); ctx.restore();

        ctx.fillStyle = fg; ctx.beginPath(); ctx.roundRect(fx - 46, fy - 22, 128, 44, 22); ctx.fill();
        ctx.strokeStyle = 'rgba(95,45,25,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx + 10, fy - 18); ctx.lineTo(fx + 12, fy + 18); ctx.stroke();
      }
      // pulgar por encima
      const tg = ctx.createLinearGradient(700, 360, 880, 420); tg.addColorStop(0, '#F2C6A0'); tg.addColorStop(1, SKIN.mid);
      ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(706, 404); ctx.bezierCurveTo(740, 370, 820, 368, 868, 392); ctx.bezierCurveTo(880, 404, 872, 420, 852, 420); ctx.bezierCurveTo(800, 412, 750, 418, 712, 432); ctx.closePath(); ctx.fill();

      const r = rng(3); ctx.fillStyle = 'rgba(90,45,25,0.10)';
      for (let i = 0; i < 900; i++) { ctx.beginPath(); ctx.arc(r() * 1000, 350 + r() * 900, .8 + r() * 1.6, 0, 7); ctx.fill(); }

    })();
    /* el bíceps por dentro (rojo, estriado) */
    function bicepsPath(flex) {
      const p = new Path2D(), top = 742 - flex * 46, bot = 975 + flex * 8;
      p.moveTo(150, 870); p.bezierCurveTo(240, top + 20, 520, top - 10, 690, 905);

    function muscle(t, flex, alpha, thread = 0) {

      ctx.strokeStyle = 'rgba(234,205,180,0.55)'; ctx.lineWidth = 18; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(60, 860); ctx.lineTo(160, 870); ctx.moveTo(680, 900); ctx.lineTo(735, 960); ctx.stroke();
      ctx.save(); ctx.shadowColor = 'rgba(255,40,40,0.6)'; ctx.shadowBlur = 40;
      const g = ctx.createLinearGradient(0, 760, 0, 980); g.addColorStop(0, '#FF5A5A'); g.addColorStop(.35, '#D61E2E'); g.addColorStop(1, '#6A0A16');

    function finger(press, wob) {

      const g = ctx.createLinearGradient(-55, 0, 55, 0); g.addColorStop(0, SKIN.lo); g.addColorStop(.45, SKIN.hi); g.addColorStop(1, SKIN.mid);

      ctx.strokeStyle = 'rgba(160,100,80,0.5)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = 'rgba(110,55,30,0.45)'; ctx.lineWidth = 4; for (const y of [-190, -175, -330]) { ctx.beginPath(); ctx.moveTo(-30, y); ctx.quadraticCurveTo(0, y - 8, 30, y); ctx.stroke(); }
      ctx.restore();
    }
    function armBackdrop() {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3B2419'); g.addColorStop(.5, '#6A4030'); g.addColorStop(1, '#2A1610');
      ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
      ctx.fillStyle = radial(560, 820, 900, [[0, 'rgba(255,200,150,0.35)'], [1, 'rgba(255,200,150,0)']]); ctx.fillRect(-W, -H, W * 3, H * 3);
    }
    /* cámara del brazo: z y foco (fx, fy) */
    function armCam(t) {
      if (t < T.toInside) {   // gancho + revelación: zoom lento que se acerca al bíceps
        const z = 1.08 + t * .012 + easeIn(prog(t, 9, T.toInside)) * .25;
        return { z, fx: lerp(540, 470, prog(t, 8, T.toInside)), fy: 800 };
      }
      if (t < T.loop[0]) {   // conclusión: de cerca al bíceps, luego brazo completo
        const k = ease(prog(t, T.zoomOut[0], T.zoomOut[1]));
        return { z: lerp(1.55 + (t - T.toArm) * .015, .92, k) - (t > T.zoomOut[1] ? (t - T.zoomOut[1]) * .004 : 0), fx: lerp(450, 520, k), fy: lerp(830, 800, k) };
      }
      const k = ease(prog(t, T.loop[0], T.loop[1]));   // cierre: vuelve al primer cuadro
      const z0 = .92 - (T.loop[0] - T.zoomOut[1]) * .004;
      return { z: lerp(z0, 1.08, k), fx: lerp(520, 540, k), fy: 800 };
    }
    function armWorld(t) {
      armBackdrop();
      const c = armCam(t);
      ctx.save(); ctx.translate(W / 2, 880); ctx.scale(c.z, c.z); ctx.translate(-c.fx, -c.fy);
      soft(() => { ctx.fillStyle = 'rgba(20,8,4,0.55)'; ctx.beginPath(); ctx.ellipse(470, 1290, 520, 70, 0, 0, 7); ctx.fill(); }, 40);
      // cuánta piel se ve

      if (t < T.toInside) {
        xray = ease(prog(t, T.xray[0], T.xray[1]));
        flex = Math.max(hit(t, [T.contract2[0]], .9, -.15), hit(t, [T.contract2[1]], .9, -.15)) * .9;

        xray = 1 - ease(prog(t, T.loop[0] + .6, T.loop[1] - .25));
        thread = ease(prog(t, T.toArm + .3, T.toArm + 1.2)) * (1 - ease(prog(t, T.loop[0], T.loop[0] + 1.2)));
        flex = hit(t, T.threadFire, .3) * .15;

      // piel translúcida: la piel se aclara y deja ver el músculo encima, con un velo de piel
      ctx.save(); ctx.globalAlpha = 1 - xray * .45; ctx.drawImage(skinCv, 0, 0); ctx.restore();

        ctx.save(); ctx.globalAlpha = xray * .55; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,230,205,0.9)'; ctx.stroke(ARM); ctx.restore();

        soft(() => { ctx.fillStyle = `rgba(80,35,18,${.5 * bump})`; ctx.beginPath(); ctx.ellipse(458, 812, 50, 12, -.15, 0, 7); ctx.fill(); }, 9);

    }

    /* =================== DENTRO DEL MÚSCULO =================== */
    function fiber(c, x1, y1, x2, y2, r, o = {}) {

      g.addColorStop(.42, `rgb(${255 - dk * 90},${118 - dk * 50 + ct * 40},${118 - dk * 50 + ct * 30})`); g.addColorStop(.7, `rgb(${170 - dk * 70},22,36)`); g.addColorStop(1, 'rgb(48,4,12)');

      c.restore();
    }
    // campo de fibras para el vuelo (se dibuja a media resolución: queda suave y es rápido)
    const FIB = (() => { const r = rng(21), out = []; for (let i = 0; i < 80; i++) out.push({ y: r() * 2.4 - 1.2, z: .2 + r() * 2.8, x: r() * 2.4 - 1.2, len: 2 + r() * 2.5, r: .055 + r() * .03, tilt: (r() - .5) * .14 }); return out.sort((a, b) => b.z - a.z); })();
    const half = document.createElement('canvas'); half.width = W / 2; half.height = H / 2; const hctx = half.getContext('2d');
    function fiberField(camZ, camX) {
      hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.clearRect(0, 0, W / 2, H / 2); hctx.scale(.5, .5);

        const z = f.z - camZ; if (z < .1) continue;
        const s = 900 / z, cx = W / 2 + (f.x - camX) * s, cy = H * .55 + f.y * s, L = f.len * s, r = f.r * s;

      }

    }
    function wineBg() {
      const g = ctx.createRadialGradient(W / 2, H * .5, 50, W / 2, H * .5, H * .8); g.addColorStop(0, '#5A0E1A'); g.addColorStop(.6, '#2A0510'); g.addColorStop(1, '#0E0206');
      ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
    }
    const GROUPS = [{ x: 300, y: 860 }, { x: 790, y: 960 }, { x: 290, y: 1230 }, { x: 790, y: 1350 }, { x: 520, y: 1640 }];
    const BRAIN = { x: 540, y: 470 };
    const LONE = 2;   // el cable que dispara por su cuenta
    function bundle(gx, gy, o = {}) {
      const r = rng(Math.round(gx * 7 + gy)), c = o.contract || 0, Lc = 300 * (1 - c * .16);
      soft(() => { ctx.fillStyle = 'rgba(10,0,4,0.55)'; ctx.beginPath(); ctx.ellipse(gx, gy + 40, Lc + 40, 120, 0, 0, 7); ctx.fill(); }, 30);
      for (const [n, rad, dk, dy] of [[6, 24, .55, -38], [7, 28, 0, 22]]) {

      ctx.save(); ctx.translate(wx, 1300); ctx.scale(.78, .78); walker(0, 0, (t - T.toStreet) * 9); ctx.restore();
      car(560, 1580, lights);
      ctx.restore();
    }

    /* =================== montaje con zoom continuo =================== */
    const WORLDS = [
      { a: 0, b: T.toInside, fn: armWorld, vign: .55, focus: [470, 860] },
      { a: T.toInside, b: T.toNight, fn: insideWorld, vign: .7, focus: [540, 1000] },
      { a: T.toNight, b: T.toSpark, fn: nightWorld, vign: .5, focus: [540, 1100] },
      { a: T.toSpark, b: T.toStreet, fn: insideWorld, vign: .7, focus: [380, 1100] },
      { a: T.toStreet, b: T.toArm, fn: streetWorld, vign: .55, focus: [560, 1500] },
      { a: T.toArm, b: 56.25, fn: armWorld, vign: .55, focus: [450, 840] },
    ];
    const TR = .45;
    function inZoom(w, t, T0) { return w.fn === insideWorld ? 1 : .8 + .2 * easeOut(prog(t, T0 - .15, T0 + TR)); }
    function drawWorld(w, t, zoom, alpha) {
      ctx.save(); ctx.globalAlpha = alpha;
      if (zoom !== 1) { ctx.translate(w.focus[0], w.focus[1]); ctx.scale(zoom, zoom); ctx.translate(-w.focus[0], -w.focus[1]); }
      w.fn(t); ctx.restore();
    }
    function renderAt(t) {
      ctx = main; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      let i = WORLDS.findIndex(w => t >= w.a && t < w.b); if (i < 0) i = WORLDS.length - 1;
      const cur = WORLDS[i], next = WORLDS[i + 1], prev = WORLDS[i - 1];
      let vign = cur.vign;
      if (next && t > next.a - TR) {                     // saliendo: el mundo actual crece hacia la cámara
        const T0 = next.a, kOut = easeIn(prog(t, T0 - TR, T0 + .15)), mixK = prog(t, T0 - .15, T0);
        if (mixK > 0) drawWorld(next, t, inZoom(next, t, T0), 1);
        ctx = offCtx; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); drawWorld(cur, t, 1 + 2.2 * kOut, 1); ctx = main;
        ctx.save(); ctx.globalAlpha = 1 - mixK * .999; ctx.drawImage(off, 0, 0); ctx.restore();
        vign = lerp(cur.vign, next.vign, mixK);
      } else if (prev && t < cur.a + TR) {                 // entrando: el nuevo mundo llega desde lejos
        const T0 = cur.a, kIn = easeOut(prog(t, T0 - .15, T0 + TR)), kOut = easeIn(prog(t, T0 - TR, T0 + .15)), mixK = prog(t, T0, T0 + .15);
        drawWorld(cur, t, inZoom(cur, t, T0), 1);
        if (mixK < 1) { ctx = offCtx; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); drawWorld(prev, t, 1 + 2.2 * kOut, 1); ctx = main; ctx.save(); ctx.globalAlpha = 1 - mixK; ctx.drawImage(off, 0, 0); ctx.restore(); }
      } else drawWorld(cur, t, 1, 1);
      finish(t, vign);
    }
    window.addEventListener('hf-seek', e => renderAt(e.detail.time));
    document.fonts && document.fonts.ready.then(() => renderAt(0));
    renderAt(0);
    window.__timelines = window.__timelines || {};
    window.__timelines['film'] = gsap.timeline({ paused: true });
  })();
  </script>
</template>
