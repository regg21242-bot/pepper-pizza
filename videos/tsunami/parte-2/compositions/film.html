  (function () {
    /* Tsunami — PARTE 2. Mismos modelos, ciudad, casita y estilo de la parte 1 (assets/lib/modelos.js). */
    const { THREE, rng, mat, glow, box, ball, cyl, hero, vecino, building, sky, stars, phone, addBrows, truck, jug, wallClock, handPhone, gate, hut, person3d, mom } = window.M;
    const W = 1080, H = 1920;
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp((t - a) / (b - a));
    const ease = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    const easeIn = k => Math.pow(clamp(k), 3), easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
    function camPath(c, t, keys) { let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++; const [t0, p0, l0] = keys[i], [t1, p1, l1] = keys[Math.min(i + 1, keys.length - 1)]; const k = t1 > t0 ? ease(prog(t, t0, t1)) : 0; c.position.set(lerp(p0[0], p1[0], k), lerp(p0[1], p1[1], k), lerp(p0[2], p1[2], k)); c.lookAt(lerp(l0[0], l1[0], k), lerp(l0[1], l1[1], k), lerp(l0[2], l1[2], k)); }
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });

    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    /* lluvia: segmentos que caen, deterministas */
    function rain(n, area, seed, color = '#A8B8E8', op = .5) {
      const r = rng(seed), pos = new Float32Array(n * 6), base = [];
      for (let i = 0; i < n; i++) base.push([(r() - .5) * area[0], r() * area[1], (r() - .5) * area[2] + area[3], .5 + r() * .5]);

      l.userData.update = (t, ox = 0, oy = 0, oz = 0) => { for (let i = 0; i < n; i++) { const [x, y, z, sp] = base[i], yy = ((y - t * 18 * sp) % area[1] + area[1]) % area[1]; pos.set([x + ox, yy + oy, z + oz, x + ox - .05, yy + oy + .45, z + oz], i * 6); } g.attributes.position.needsUpdate = true; };
      return l;

    const CITY = (() => {

      const hp = hillG.attributes.position, hr = rng(3); for (let i = 0; i < hp.count; i++) { const x = hp.getX(i), z = hp.getZ(i), dd = Math.hypot(x, z); hp.setY(i, Math.max(0, 6 - dd * .42) + hr() * .35); }
      hillG.computeVertexNormals();
      const hill = new THREE.Mesh(hillG, mat('#24302A', { flatShading: true })); hill.position.set(0, 14, 18); s.add(hill);
      s.add(box(60, 14, 30, mat('#161E1C', { flatShading: true }), 0, 7, 22)); s.add(box(240, .3, 70, mat('#1A1A2A'), 0, -.1, -5));

      const hutL = new THREE.PointLight('#FFC070', 1.2, 10, 2); hutL.position.set(-6, 21, 21.5); s.add(hutL);
      const p = hero(), v = vecino(); p.position.set(-.9, 19.6, 13.4); v.position.set(.8, 19.5, 13.8); p.rotation.y = Math.PI; v.rotation.y = Math.PI - .15; s.add(p, v);

      const waterM = new THREE.MeshStandardMaterial({ color: '#3A5070', roughness: .15, metalness: .45, transparent: true, opacity: .95 });
      const water = new THREE.Mesh(new THREE.BoxGeometry(300, 1, 1), waterM); s.add(water);
      const foamM = new THREE.MeshBasicMaterial({ color: '#E8F0FF', toneMapped: false, fog: false, transparent: true, opacity: .95 });
      const foam = new THREE.Mesh(new THREE.BoxGeometry(300, .5, 1.6), foamM); s.add(foam);
      const sirens = []; for (let i = 0; i < 4; i++) { const L = new THREE.PointLight('#FF2020', 0, 30, 2); L.position.set(-30 + i * 20, 4, -36); s.add(L); sirens.push(L); }
      const rn = rain(900, [60, 40, 40, 6], 4, '#8A9AD0', .28); s.add(rn);

          sk.userData.mat.uniforms.red.value = .3;

        blds.forEach(b => { const passed = !isWave && front > b.position.z ? clamp((front - b.position.z) / 18) : 0; b.userData.paint(.45, 0, passed); });
        sk.userData.mat.uniforms.red.value = .3 + .08 * Math.sin(t * 3);

    })();

    /* ================= EL PORTÓN: la mamá y cinco más ================= */

      // la mamá y cinco desconocidos detrás

        person3d({ shirt: '#8A6A3A', pants: '#3A3A40', skin: '#D8A880', hair: '#6A4A2A', height: .82, width: .9, seed: 3, hairStyle: 'rizos' }),
        person3d({ shirt: '#3A5A4A', pants: '#2E2E36', skin: '#A87050', hair: '#1A120C', height: 1.1, width: 1.05 }),
        person3d({ shirt: '#6A3A5A', pants: '#2A2A30', skin: '#E0B090', hair: '#B8B4AC', height: .98, width: 1.0 }),
        person3d({ shirt: '#4A4A6A', pants: '#30303A', skin: '#C08A64', hair: '#2A1A10', height: .7, width: .8, hairStyle: 'rizos', seed: 9 }),
      ];
      const spots = [[-1.4, 3.2], [1.5, 3.4], [-.4, 4.4], [.9, 5.0], [-2.1, 4.8]];
      people.forEach((pp, i) => { pp.position.set(spots[i][0], 0, spots[i][1]); pp.rotation.y = Math.PI + (i - 2) * .08; pp.userData.brows(.8); pp.userData.mouth('flat'); s.add(pp); });
      const rn = rain(1600, [14, 12, 12, 3], 7, '#B8C8F0', .45); s.add(rn);
      const camera = cam(36);
      function update(t) {
        m.userData.drip(t); m.userData.look(0, .2);
        m.userData.armR.rotation.x = -.9 + Math.sin(t * 2.6) * .25; m.userData.elbowR.rotation.x = -.6;   // se agarra de los barrotes

    /* ================= FINAL: primer plano, dudando (igual que la parte 1) ================= */

    })();


    /* tiempos de la parte 2 (de la voz) */
    const T2 = { cuts: [2.6, 8.95, 11.45, 16.3, 24.45, 29.9, 34.95, 38.25, 43.85, 47.8, 50.45], end: 58.58,
      typing: [9.15, 10.0], sent: 10.15, noSignal: 10.75, knocks: [35.8, 36.05, 36.3, 36.95, 37.2, 37.45] };
    window.__TSU2 = T2;

    /* ================= CELULAR: sin señal ================= */
    function wrap(c, text, x, y, maxW, lh) { const words = text.split(' '); let line = '', lines = []; for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; } lines.push(line); lines.forEach((l, i) => c.fillText(l, x, y + i * lh)); return lines.length; }
    function bubble(c, text, y, right, col, tcol) { c.font = '700 24px Nunito, sans-serif'; const words = text.split(' '); let line = '', n = 1; for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > 240 && line) { n++; line = w; } else line = test; } const h = 30 * n + 26, x = right ? 54 : 16; c.fillStyle = col; c.beginPath(); c.roundRect(x, y, 290, h, 20); c.fill(); c.fillStyle = tcol; wrap(c, text, x + 16, y + 38, 258, 30); return h; }
    function drawChat2(u, t) {
      const c = u.ctx; c.fillStyle = '#0E1220'; c.fillRect(0, 0, 360, 720);
      c.fillStyle = '#1A2238'; c.fillRect(0, 0, 360, 112);
      c.fillStyle = '#E8A0B8'; c.beginPath(); c.arc(52, 70, 26, 0, 7); c.fill(); c.fillStyle = '#5A2A3A'; c.font = '900 26px Nunito, sans-serif'; c.textAlign = 'center'; c.fillText('M', 52, 79);

      if (noSig) { c.strokeStyle = '#FF4A4A'; c.lineWidth = 3; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(300 + i * 12, 30); c.lineTo(300 + i * 12, 30 - 6 - i * 4); c.stroke(); } c.beginPath(); c.moveTo(296, 10); c.lineTo(342, 32); c.stroke(); }
      let y = 140;
      y += bubble(c, 'No hay taxis, seguimos en el malecón.', y, false, '#DCDCE8', '#1A1A28') + 14;

      const msg = 'Estoy en el cerro, estoy bien';

        if (t > T2.noSignal - .2) { c.fillStyle = '#FF4A4A'; c.font = '900 20px Nunito, sans-serif'; c.textAlign = 'right'; c.fillText('⚠ No enviado', 340, y + h + 26); c.textAlign = 'left'; }
      }

      const typed = t < T2.typing[0] ? '' : t < T2.sent ? msg.slice(0, Math.floor(msg.length * prog(t, T2.typing[0], T2.typing[1]))) : '';
      c.fillStyle = '#FFFFFF'; c.font = '700 20px Nunito, sans-serif'; c.fillText(typed + (t < T2.sent && Math.sin(t * 12) > 0 ? '|' : ''), 30, 687);

    }
    const CEL = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#06081A');
      s.add(new THREE.HemisphereLight('#5060B0', '#100818', .7));
      const key = new THREE.PointLight('#9AB0FF', 1.2, 10, 2); key.position.set(-1.5, 1.5, 2.5); s.add(key);
      const red = new THREE.PointLight('#FF3030', 1.5, 8, 2); red.position.set(1.8, -1, 1.5); s.add(red);
      const r = rng(31);
      for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.CircleGeometry(.15 + r() * .35, 20), new THREE.MeshBasicMaterial({ color: r() < .5 ? '#FFB860' : '#FF3A3A', transparent: true, opacity: .22, toneMapped: false, depthWrite: false })); m.position.set((r() - .5) * 9, (r() - .5) * 14, -6 - r() * 4); s.add(m); }
      const hp = handPhone(); hp.scale.setScalar(2.1); s.add(hp);
      const camera = cam(34);
      function update(t) {
