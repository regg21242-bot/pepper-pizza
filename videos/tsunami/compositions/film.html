  <script>
  (function () {
    /* =====================================================================
       "Alerta de tsunami a las 3 a.m." — 12 escenas 3D low-poly (Three.js).
       Cada cuadro es función solo del tiempo t. Los tiempos vienen de la voz (Whisper).
       Modelos compartidos en assets/lib/modelos.js (window.M).

    const { THREE, rng, mat, glow, box, ball, cyl, hero, vecino, building, sky, stars, phone, addBrows, truck, jug, wallClock, handPhone, gate, hut } = window.M;
    const W = 1080, H = 1920;
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp((t - a) / (b - a));

    const easeIn = k => Math.pow(clamp(k), 3), easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
    const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
    function camPath(c, t, keys) {   // keys: [[t, pos[3], look[3]], ...] con interpolación suave

    /* tiempos clave (de la voz) */

    window.__TSU_T = T;

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(W, H, false);
    renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .9;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const cam = (fov = 38) => new THREE.PerspectiveCamera(fov, W / H, .05, 900);

    /* ---------- pantalla del celular ---------- */
    function wrap(c, text, x, y, maxW, lh) { const words = text.split(' '); let line = '', lines = []; for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; } lines.push(line); lines.forEach((l, i) => c.fillText(l, x, y + i * lh)); return lines.length; }

        c.fillStyle = '#FFFFFF'; c.beginPath(); c.moveTo(180, 150); c.lineTo(290, 330); c.lineTo(70, 330); c.closePath(); c.fill();
        c.fillStyle = '#B3121A'; c.fillRect(170, 200, 20, 78); c.fillRect(170, 292, 20, 20);

        c.font = '700 24px Nunito, sans-serif'; c.fillText('Evacúe a zonas altas', 180, 520); c.globalAlpha = 1;

    function drawChat(u, t, msgs, clock) {
      const c = u.ctx; c.fillStyle = '#0E1220'; c.fillRect(0, 0, 360, 720);
      c.fillStyle = '#1A2238'; c.fillRect(0, 0, 360, 112);
      c.fillStyle = '#E8A0B8'; c.beginPath(); c.arc(52, 70, 26, 0, 7); c.fill(); c.fillStyle = '#5A2A3A'; c.font = '900 26px Nunito, sans-serif'; c.textAlign = 'center'; c.fillText('M', 52, 79);
      c.fillStyle = '#FFFFFF'; c.textAlign = 'left'; c.font = '800 28px Nunito, sans-serif'; c.fillText('Mamá', 92, 78);
      c.font = '700 18px Nunito, sans-serif'; c.fillStyle = 'rgba(255,255,255,0.7)'; c.fillText(clock, 16, 26);
      let y = 140;
      for (const m of msgs) {
        if (t < m.at - .9) continue;

    /* ================= RECÁMARA (temblor + alerta) ================= */

      const nst = new THREE.Group(); s.add(nst); nst.position.set(1.9, 0, -2.2);

      const shade = cyl(.18, .3, .32, mat('#E8D8B0'), 14); shade.position.y = .62; lamp.add(shade);

      const glowL = new THREE.PointLight('#FF2A2A', 0, 5, 2); glowL.position.set(.2, 1.1, .05); nst.add(glowL);
      const camera = cam();
      function update(t) {

        const sh = (f, a) => Math.sin(t * f) * a * shake;
        bed.position.x = .2 + sh(31, .03); bed.rotation.z = sh(23, .006);

    /* ================= CIUDAD Y CERRO (ventanas rojas / la línea blanca) ================= */

      const seaG = new THREE.PlaneGeometry(400, 200, 80, 40); seaG.rotateX(-Math.PI / 2);
      const sea = new THREE.Mesh(seaG, mat('#0C1A44', { roughness: .35, metalness: .1, flatShading: true })); sea.position.set(0, -.2, -185); s.add(sea);
      const seaPos = seaG.attributes.position, seaBase = seaPos.array.slice();

      const halo = new THREE.Mesh(new THREE.PlaneGeometry(300, 12), new THREE.MeshBasicMaterial({ color: '#BFD8FF', transparent: true, opacity: .25, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false })); halo.rotation.x = -Math.PI / 2; s.add(halo);
      const sirens = []; for (let i = 0; i < 4; i++) { const L = new THREE.PointLight('#FF2020', 0, 30, 2); L.position.set(-30 + i * 20, 4, -36); s.add(L); sirens.push(L); }
      const camera = cam();
      function update(t) {
        for (let i = 0; i < seaPos.count; i++) { const x = seaBase[i * 3], z = seaBase[i * 3 + 2]; seaPos.setY(i, Math.sin(x * .08 + t * .8) * .25 + Math.cos(z * .1 + t * .6) * .25); }
        seaPos.needsUpdate = true; seaG.computeVertexNormals();
        const street = t < 30;
        sirens.forEach((L, i) => L.intensity = street ? prog(t, T.cityRed[0], T.cityRed[0] + 1) * (3 + 2 * Math.sin(t * 6 + i)) : 2 + Math.sin(t * 5 + i));

    /* ================= CELULAR EN LA MANO ================= */
    const CEL = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#06081A');

      const key = new THREE.PointLight('#9AB0FF', 1.2, 10, 2); key.position.set(-1.5, 1.5, 2.5); s.add(key);
      const red = new THREE.PointLight('#FF3030', 0, 8, 2); red.position.set(1.8, -1, 1.5); s.add(red);
      const r = rng(31);
      for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.CircleGeometry(.15 + r() * .35, 20), new THREE.MeshBasicMaterial({ color: r() < .5 ? '#FFB860' : '#FF3A3A', transparent: true, opacity: .22, toneMapped: false, depthWrite: false })); m.position.set((r() - .5) * 9, (r() - .5) * 14, -6 - r() * 4); s.add(m); }

    /* ================= PASILLO: tocan la puerta ================= */
    const HALL = (() => {

      for (let i = 0; i < 5; i++) door.add(ball(.012, mat('#B8B8C0', { metalness: .8 }), .98 - i * .03, 1.5 - Math.sin(i / 4 * Math.PI) * .06, .09, 6));
      // número del depa
      const ncv = document.createElement('canvas'); ncv.width = 128; ncv.height = 80; const nc = ncv.getContext('2d'); nc.fillStyle = '#C8A040'; nc.fillRect(0, 0, 128, 80); nc.fillStyle = '#2A1A10'; nc.font = '900 60px Nunito, sans-serif'; nc.textAlign = 'center'; nc.textBaseline = 'middle'; nc.fillText('4B', 64, 44);
      const nt = new THREE.CanvasTexture(ncv); nt.encoding = THREE.sRGBEncoding; const plate = new THREE.Mesh(new THREE.PlaneGeometry(.2, .125), new THREE.MeshStandardMaterial({ map: nt, metalness: .5, roughness: .4 })); plate.position.set(.59, 2.02, .07); door.add(plate);
      // tapete y luz que se cuela por debajo de la puerta
      s.add(box(1.0, .02, .55, mat('#5A2A2A'), 0, .01, -4.55));
      const gapM = new THREE.MeshBasicMaterial({ color: '#FFD890', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
      const gap = new THREE.Mesh(new THREE.PlaneGeometry(1.1, .7), gapM); gap.rotation.x = -Math.PI / 2; gap.position.set(0, .025, -4.62); s.add(gap);
      const gapLine = new THREE.Mesh(new THREE.PlaneGeometry(1.15, .025), gapM); gapLine.position.set(0, .015, -4.94); s.add(gapLine);
      // escalera del edificio, afuera (se ve al abrir)
      const stairM = mat('#5A4A3E'), railM = mat('#2A2A30', { metalness: .5, roughness: .5 });
      for (let i = 0; i < 10; i++) s.add(box(1.2, .2 * (i + 1), .32, stairM, .75, .1 * (i + 1), -7.0 - i * .32));

      { a: 0, b: 8.4, s: BED }, { a: 8.4, b: 11.9, s: CITY }, { a: 11.9, b: 16.2, s: CEL }, { a: 16.2, b: 25.2, s: HALL },
      { a: 25.2, b: 29.5, s: FLASH }, { a: 29.5, b: 39.2, s: COAST }, { a: 39.2, b: 41.6, s: HILL }, { a: 41.6, b: 50.9, s: HUT },
      { a: 50.9, b: 54.3, s: CITY }, { a: 54.3, b: 60.5, s: CEL }, { a: 60.5, b: 62.0, s: HUT }, { a: 62.0, b: 64.6, s: GATE }, { a: 64.6, b: 73.94, s: END },
    ];
    const rtA = new THREE.WebGLRenderTarget(W, H, { samples: 4 }), rtB = new THREE.WebGLRenderTarget(W, H, { samples: 4 });
    const post = new THREE.ShaderMaterial({
      uniforms: { a: { value: rtA.texture }, b: { value: rtB.texture }, mixk: { value: 0 }, za: { value: 1 }, zb: { value: 1 }, red: { value: 0 }, warm: { value: 0 }, frame: { value: 0 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
      fragmentShader: `uniform sampler2D a; uniform sampler2D b; uniform float mixk, za, zb, red, warm, frame; varying vec2 vUv;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
        void main(){
          vec3 ca = texture2D(a, (vUv - .5) / za + .5).rgb, cb = texture2D(b, (vUv - .5) / zb + .5).rgb;
          vec3 c = mix(ca, cb, mixk);
          float l = dot(c, vec3(.299,.587,.114));
          c = mix(c, vec3(l * 1.55 + c.r * .15, l * .3, l * .26), clamp(red * 1.8, 0., .92));
          c = mix(c, c * vec3(1.1, .98, .8), warm);
          vec2 q = vUv - .5; c *= 1. - smoothstep(.35, .85, length(q * vec2(1., .62))) * .55;
          c += (hash(vUv * vec2(1080., 1920.) + frame * 17.) - .5) * .035;
          gl_FragColor = vec4(max(c, 0.), 1.);
          #include <tonemapping_fragment>
          #include <encodings_fragment>
        }`,
      depthTest: false, depthWrite: false });
    const postScene = new THREE.Scene(); postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post)); const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const TR = .45;
    function draw(sc, t, rt) { const g = sc.s.update(t) || {}; renderer.setRenderTarget(rt); renderer.render(sc.s.scene, sc.s.camera); return g; }
    function renderAt(t) {
      let i = SC.findIndex(x => t >= x.a && t < x.b); if (i < 0) i = SC.length - 1;
      const cur = SC[i], nxt = SC[i + 1], prv = SC[i - 1];
      let A = cur, B = null, k = 0, za = 1, zb = 1, T0 = 0;
      if (nxt && t > nxt.a - TR) { B = nxt; T0 = nxt.a; }
      else if (prv && t < cur.a + TR) { A = prv; B = cur; T0 = cur.a; }
      // si A y B son la misma escena 3D (no pasa aquí) se dibuja una sola
      let g = draw(A, t, rtA);
      if (B) {
        k = ease(prog(t, T0 - .2, T0 + .2)); za = 1 + .35 * easeIn(prog(t, T0 - TR, T0 + .2)); zb = 1.3 - .3 * easeOut(prog(t, T0 - .2, T0 + TR));
        const g2 = draw(B, t, rtB);
        g = { red: lerp(g.red || 0, g2.red || 0, k), warm: lerp(g.warm || 0, g2.warm || 0, k) };
      }
      const u = post.uniforms; u.mixk.value = k; u.za.value = za; u.zb.value = zb; u.red.value = g.red || 0; u.warm.value = g.warm || 0; u.frame.value = Math.round(t * 30);
      renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    }
    window.addEventListener('hf-seek', e => renderAt(e.detail.time));
    renderAt(0);
    window.__timelines = window.__timelines || {};
    window.__timelines['film'] = gsap.timeline({ paused: true });
  })();
  </script>
