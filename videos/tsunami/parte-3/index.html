<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/lib/three.min.js"></script>
    <script src="assets/lib/modelos.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05060f; }
      #root { width: 100%; height: 100%; position: relative; font-family: Nunito, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="film" class="clip" data-composition-id="film" data-composition-src="compositions/film.html"
           data-start="0" data-duration="12" data-track-index="0" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="apertura" class="clip" data-composition-id="apertura" data-composition-src="compositions/apertura.html"
           data-start="0" data-duration="12" data-track-index="2" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="eleccion" class="clip" data-composition-id="eleccion" data-composition-src="compositions/eleccion.html"
           data-start="0" data-duration="12" data-track-index="3" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:3"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
