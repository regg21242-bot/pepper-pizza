<template>
  <style>
    #root { position: absolute; inset: 0; background: #8FD3F4; overflow: hidden; }
    #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* texto principal arriba: 1–3 palabras, Anton, borde negro grueso */
    #txt { position: absolute; left: 50px; width: 860px; top: 150px; text-align: center; font-family: Anton, sans-serif; font-size: 150px; line-height: .95; letter-spacing: 2px;
      -webkit-text-stroke: 14px #111; paint-order: stroke fill; text-shadow: 0 12px 0 rgba(0,0,0,.35); text-transform: uppercase; transform-origin: 50% 60%; }
    /* medidores */
    .gauge { position: absolute; top: 420px; width: 230px; height: 200px; transform: scale(.8); transform-origin: 0 0; }
    #gF { left: 60px; } #gV { left: 265px; }
    .gauge .lab { position: absolute; left: 0; width: 230px; top: 150px; text-align: center; font-family: Anton, sans-serif; font-size: 40px; color: #fff; -webkit-text-stroke: 7px #111; paint-order: stroke fill; }
    .gauge .val { position: absolute; left: 0; width: 230px; top: 98px; text-align: center; font-family: Anton, sans-serif; font-size: 44px; color: #FFE14A; -webkit-text-stroke: 7px #111; paint-order: stroke fill; }
    /* etiquetas pegadas a las piezas */
    .tag { position: absolute; font-family: Anton, sans-serif; font-size: 58px; color: #FFE14A; -webkit-text-stroke: 9px #111; paint-order: stroke fill; white-space: nowrap; transform: translate(-50%, -100%); }
    .tag::after { content: ""; position: absolute; left: 50%; top: 100%; width: 6px; height: 46px; background: #111; transform: translateX(-50%); }
    #lines { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="film" data-start="0" data-duration="12" data-width="1080" data-height="1920">
    <canvas id="gl" width="1080" height="1920" data-layout-ignore></canvas>
    <svg id="lines" viewBox="0 0 1080 1920" data-layout-ignore></svg>
    <div id="tags" data-layout-ignore></div>
    <div class="gauge" id="gF" data-layout-ignore>
      <svg viewBox="0 0 230 200" width="230" height="200">
        <circle cx="115" cy="115" r="100" fill="#FFF8E8" stroke="#111" stroke-width="10"/>
        <path d="M 39.4 175.6 A 100 100 0 0 1 115 15" fill="none" stroke="#36D46A" stroke-width="20" transform="translate(0,0)"/>
        <path d="M 115 15 A 100 100 0 0 1 172 33" fill="none" stroke="#F5C431" stroke-width="20"/>
        <path d="M 172 33 A 100 100 0 0 1 190.6 175.6" fill="none" stroke="#FF3B30" stroke-width="20"/>
        <g id="gFn"><polygon points="111,115 119,115 116,30 114,30" fill="#111"/></g><circle cx="115" cy="115" r="12" fill="#111"/>
      </svg><div class="lab">FUERZA</div></div>
    <div class="gauge" id="gV" data-layout-ignore>
      <svg viewBox="0 0 230 200" width="230" height="200">
        <circle cx="115" cy="115" r="100" fill="#FFF8E8" stroke="#111" stroke-width="10"/>
        <g id="gVt"></g>
        <g id="gVn"><polygon points="111,115 119,115 116,30 114,30" fill="#E33A2E"/></g><circle cx="115" cy="115" r="12" fill="#111"/>
      </svg><div class="val" id="gVv">0</div><div class="lab">KM/H</div></div>
    <div id="txt" data-layout-ignore></div>
  </div>
  <script>
  (function () {
    /* "Si a tu carrito del súper le pones el motor de una podadora…"  — estilo caricatura con contornos (assets/lib/caricatura.js) */
    const K = window.K, THREE = K.THREE, { clamp, lerp, prog, ease, easeOut, backOut, box, cyl, toon, flat } = K;
    const W = 1080, H = 1920;
    const R = K.crearRender(document.getElementById('gl'), W, H);
    const cam = (fov = 40) => new THREE.PerspectiveCamera(fov, W / H, .05, 400);
    function camPath(c, t, keys) { let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++; const [t0, p0, l0] = keys[i], [t1, p1, l1] = keys[Math.min(i + 1, keys.length - 1)]; const k = t1 > t0 ? ease(prog(t, t0, t1)) : 0; c.position.set(lerp(p0[0], p1[0], k), lerp(p0[1], p1[1], k), lerp(p0[2], p1[2], k)); c.lookAt(lerp(l0[0], l1[0], k), lerp(l0[1], l1[1], k), lerp(l0[2], l1[2], k)); }
    function luces(s, sun = 1.6) { s.add(new THREE.HemisphereLight('#FFFFFF', '#9A8A7A', .7)); const d = new THREE.DirectionalLight('#FFF0D8', sun); d.shadow.bias = -.0006; d.shadow.normalBias = .03; d.position.set(6, 12, 8); d.castShadow = true; d.shadow.mapSize.set(2048, 2048); const sc = d.shadow.camera; sc.left = sc.bottom = -8; sc.right = sc.top = 8; sc.far = 40; s.add(d, d.target); return d; }

    /* ======== CALLE: el mismo carrito, el chavo y la calle en todo el video ======== */
    const CALLE = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#8FD3F4'); s.fog = new THREE.Fog('#BFE6F7', 30, 90);
      const sun = luces(s, 1.4);
      const st = K.street({ shopX: 7.5, semX: 4.2, trees: [-9, -2.2, 12, 20] }); s.add(st.group);
      // nubes caricatura
      const r = K.rng(4); for (let i = 0; i < 6; i++) { const c = new THREE.Group(); for (let j = 0; j < 4; j++) c.add(K.ball(.9 + r() * .6, '#FFFFFF', j * 1.1 - 1.6, r() * .5, 0, 12)); c.position.set(-20 + i * 9, 14 + r() * 4, -30); s.add(c); }
      const cart = K.carrito(); s.add(cart); const C = cart.userData;
      const mot = K.motor(); mot.position.set(-.3, .22, 0); mot.scale.setScalar(.95); cart.add(mot);
      K.cinchos(cart, [-.42, -.18], .32, .36);
      const kit = K.kartKit(); cart.add(kit); kit.visible = false;
      const kart = K.gokart(); s.add(kart); kart.visible = false; const KT = kart.userData;
      const vol = K.volante(); vol.position.set(.18, .62, 0); vol.rotation.y = Math.PI / 2; vol.rotation.x = .0; vol.rotation.z = .5; cart.add(vol); vol.visible = false;
      const kid = K.chavo(); s.add(kid); const P = kid.userData;   // chavo de bloques sin cara: gorra roja, sudadera azul, jeans
      const smoke = K.puffs(10, 3, '#EDEDED'); s.add(smoke);
      const camera = cam(40);
      function update(t, mode, lt) {
        st.setLight(2);
        if (mode === 'arranque') {   // escena 1: amarra el motor y jala la cuerda
          cart.visible = true; kart.visible = false; cart.position.set(0, 0, 0); cart.rotation.set(0, 0, 0); kit.visible = vol.visible = false; C.wires.forEach(w => w.visible = true);
          kid.position.set(-.95, 0, .12); kid.rotation.y = Math.PI / 2;
          const pull = ease(prog(lt, .4, .9)) * (1 - ease(prog(lt, 1.1, 1.6)));
          K.pose(P, { armR: [-.6 - 1.2 * pull, 0, -.2], elbowR: [-.2, 0, 0], armL: [-.5, 0, .2], elbowL: [-.9, 0, 0], legL: [-.25, 0, 0], legR: [.2, 0, 0], kneeL: [.3, 0, 0], head: [.25, -.3, 0] });
          P.torso.rotation.x = .1 + .15 * pull; kid.position.y = -.02 * pull;
          const run = lt > .9 ? 1 : 0; cart.position.y = run * Math.abs(Math.sin(lt * 40)) * .008;
          mot.updateMatrixWorld(true); const ex = mot.localToWorld(mot.userData.exhaust.clone());
          smoke.userData.update(lt, run * 1.6, ex, new THREE.Vector3(-.6, .9, -.2));
          camPath(camera, lt, [[-.3, [1.0, 2.3, 4.1], [-.5, 1.15, -.2]], [4.5, [.85, 2.15, 3.7], [-.5, 1.1, -.2]]]);
          return { tags: [] };
        }
        // final: go-kart completo, el chavo sentado saluda al pasar
        cart.visible = false; kart.visible = true;
        const x = lerp(-2.5, 2.5, lt / 4); kart.position.set(x, 0, .3); const cart_ = kart;
        KT.wheels.forEach(o => o.w.rotation.z = -x / o.r);
        kid.position.set(x - .2, -.6, .3); kid.rotation.y = Math.PI / 2;
        K.pose(P, { legL: [-1.45, 0, 0], legR: [-1.45, 0, 0], kneeL: [1.2, 0, 0], kneeR: [1.2, 0, 0], armR: [-1.0, 0, 0], elbowR: [-.4, 0, 0], armL: [-.4, 0, -2.4 + Math.sin(lt * 12) * .3], elbowL: [0, 0, -.4], head: [0, -.8, 0] });
        KT.motor.updateMatrixWorld(true); const ex = KT.motor.localToWorld(KT.motor.userData.exhaust.clone());
        smoke.userData.update(lt, 2.2, ex, new THREE.Vector3(-1.4, .5, 0));
        camPath(camera, lt, [[-.3, [x + 0, 1.0, 3.2], [x - .1, 1.05, 0]], [4.5, [x + 0, 1.0, 3.2], [x - .1, 1.05, 0]]]);
        camera.position.set(kart.position.x + 1.7, 2.3, 3.8); camera.lookAt(kart.position.x - .1, 1.05, .1);
        return { tags: [], speed: 1 };
      }
      return { scene: s, camera, update, cart, kid };
    })();

    /* ======== DESPIECE DEL CLUTCH (rayos X) ======== */
    const CLUTCH = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#0D2A4A');
      s.add(new THREE.HemisphereLight('#FFFFFF', '#3A4A6A', .5)); const d = new THREE.DirectionalLight('#FFFFFF', 1.2); d.position.set(2, 3, 4); s.add(d);
      const cl = K.clutch(); cl.scale.setScalar(2.2); s.add(cl); const Q = cl.userData;
      // flechas verdes hacia afuera (fuerza centrífuga)
      const arrows = []; for (let i = 0; i < 3; i++) { const a = new THREE.Group(); a.add(K.box(.12, .035, .035, '#9BE53A', .06, 0, 0)); const tip = K.cyl(0, .045, .08, '#9BE53A', 10, .15, 0, 0); tip.rotation.z = -Math.PI / 2; a.add(tip); const piv = new THREE.Group(); piv.rotation.z = i * Math.PI * 2 / 3; piv.add(a); a.position.x = .45; a.position.z = .02; s.add(piv); arrows.push(a); }
      const camera = cam(38);
      function update(t, mode, lt) {
        const dk = ease(prog(lt, .2, 1.2)); Q.despiece(dk);
        const rpm = .5 + .5 * Math.sin(lt * 1.6); Q.abre(rpm); cl.rotation.z = lt * (2 + 8 * rpm);
        arrows.forEach((a, i) => { a.position.x = .42 + .06 * rpm; a.scale.setScalar(.6 + .6 * rpm); a.parent.rotation.z = i * Math.PI * 2 / 3 + lt * (2 + 8 * rpm) * .0; });
        cl.rotation.y = 1.25; cl.rotation.x = .12;
        camPath(camera, lt, [[-.3, [.95, .55, 4.1], [.3, -.1, 0]], [4.5, [.85, .5, 3.7], [.3, -.1, 0]]]);
        // posiciones 3D de las etiquetas
        const tags = [];
        cl.updateMatrixWorld(true);
        const wp = (obj, v) => obj.localToWorld(v.clone());
        tags.push(['TAMBOR', wp(Q.drum, new THREE.Vector3(.1, .17, 0))]);
        tags.push(['ZAPATAS', wp(Q.shoes[0], new THREE.Vector3(.15, .03, .03))]);
        tags.push(['RESORTES', wp(Q.springs[1].parent, new THREE.Vector3(.13, 0, 0))]);
        return { tags, fuerza: .25 + .6 * rpm, xray: .35 };
      }
      return { scene: s, camera, update };
    })();

    /* ======== montaje provisional para los fotogramas fijos ======== */
    const SC = [{ a: 0, b: 4, s: CALLE, m: 'arranque' }, { a: 4, b: 8, s: CLUTCH }, { a: 8, b: 99, s: CALLE, m: 'final' }];
    const TXT = [[0.2, 4, 'MOTOR DE PODADORA', '#FFE14A'], [4.2, 8, 'CLUTCH CENTRÍFUGO', '#7CF04A'], [8.2, 99, '¡GO-KART!', '#FFE14A']];
    const $ = id => document.getElementById(id);
    const txt = $('txt'), tagsEl = $('tags'), gFn = $('gFn'), gVn = $('gVn'), gVv = $('gVv'), lines = $('lines');
    // marcas del velocímetro 0–80
    (() => { const g = $('gVt'); for (let v = 0; v <= 80; v += 10) { const a = (-135 + v / 80 * 270) * Math.PI / 180; const x1 = 115 + Math.sin(a) * 86, y1 = 115 - Math.cos(a) * 86, x2 = 115 + Math.sin(a) * (v % 20 ? 76 : 68), y2 = 115 - Math.cos(a) * (v % 20 ? 76 : 68); g.insertAdjacentHTML('beforeend', `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="${v % 20 ? 4 : 7}"/>`); if (v % 20 === 0) g.insertAdjacentHTML('beforeend', `<text x="${115 + Math.sin(a) * 52}" y="${115 - Math.cos(a) * 52 + 8}" font-family="Anton" font-size="22" text-anchor="middle" fill="#111">${v}</text>`); } })();
    const tagPool = [];
    function setTags(list, camera) {
      while (tagPool.length < list.length) { const d = document.createElement('div'); d.className = 'tag'; tagsEl.appendChild(d); tagPool.push(d); }
      tagPool.forEach((d, i) => { if (i >= list.length) { d.style.display = 'none'; return; } const [label, p] = list[i]; const v = p.clone().project(camera); d.style.display = 'block'; d.textContent = label; d.style.left = ((v.x + 1) / 2 * W) + 'px'; d.style.top = ((1 - v.y) / 2 * H - 50) + 'px'; });
    }
    function renderAt(t) {
      let sc = SC.find(x => t >= x.a && t < x.b) || SC[SC.length - 1];
      const lt = t - sc.a, g = sc.s.update(t, sc.m, lt) || {};
      R.render(sc.s.scene, sc.s.camera, { xray: g.xray || 0 });
      setTags(g.tags || [], sc.s.camera);
      // texto principal con "pop"
      const f = TXT.find(([a, b]) => t >= a && t < b);
      if (f) { txt.textContent = f[2]; txt.style.color = f[3]; const k = prog(t, f[0], f[0] + .22); txt.style.transform = `scale(${.4 + .6 * backOut(k)}) rotate(${(1 - k) * -6}deg)`; txt.style.opacity = k > 0 ? 1 : 0; } else txt.style.opacity = 0;
      // medidores
      const fu = g.fuerza ?? .2, kmh = g.kmh ?? (g.speed ? 45 : 0);
      gFn.setAttribute('transform', `rotate(${-135 + fu * 270} 115 115)`);
      gVn.setAttribute('transform', `rotate(${-135 + clamp(kmh / 80) * 270} 115 115)`); gVv.textContent = Math.round(kmh);
      // líneas de velocidad
      lines.innerHTML = g.speed ? Array.from({ length: 14 }, (_, i) => { const y = 760 + ((i * 97 + 31) % 900), x = ((i * 233 - t * 2600) % 1300 + 1300) % 1300 - 200, w = 120 + (i * 37) % 160; return `<line x1="${x}" y1="${y}" x2="${x + w}" y2="${y}" stroke="#fff" stroke-width="${6 + i % 3 * 2}" stroke-linecap="round" opacity=".85"/>`; }).join('') : '';
    }
    window.addEventListener('hf-seek', e => renderAt(e.detail.time));
    renderAt(0);
    if (document.fonts) document.fonts.load('130px Anton').then(() => { K.repaint(); renderAt(0); });
    window.__timelines = window.__timelines || {};
    window.__timelines['film'] = gsap.timeline({ paused: true });
  })();
  </script>
</template>
