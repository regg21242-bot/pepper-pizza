    function dist(t, segs) { let d = 0; for (const [a, b, v0, v1] of segs) { if (t <= a) break; const e = Math.min(t, b), u = (e - a) / (b - a); d += (b - a) * (v0 * u + (v1 - v0) * u * u / 2); } return d; }
    function speed(t, segs) { for (const [a, b, v0, v1] of segs) if (t >= a && t < b) return lerp(v0, v1, (t - a) / (b - a)); return 0; }

    /* ======== LA CALLE ======== */

      elote.add(cyl(.02, .02, 1.6, '#5B616C', 6, .3, 1.1, 0));
      const umb = new THREE.Group(); umb.position.set(.3, 1.9, 0); elote.add(umb);
      for (let i = 0; i < 8; i++) umb.add(K.mesh(new THREE.ConeGeometry(.75, .3, 2, 1, true, i * Math.PI / 4, Math.PI / 4), toon(i % 2 ? '#FFFFFF' : '#36C45A', { side: THREE.DoubleSide })));
      const elotes = []; for (let i = 0; i < 6; i++) { const e = new THREE.Group(); e.add(cyl(.035, .035, .2, '#F5C431', 8)); e.add(cyl(.008, .008, .1, '#C9A06A', 5, 0, -.13, 0)); e.position.set(-.3 + i * .12, .9, 0); e.rotation.z = Math.PI / 2; elote.add(e); elotes.push({ e, x0: -.3 + i * .12, vx: 1 + i * .3, vy: 2 + (i % 3) * .6, sp: 6 + i }); }

      const segS2 = [[11.95, 13.55, 0, 5.5]], segV = [[30.2, 33.0, 0, 3.2]], segE = [[48.0, 50.3, 4.2, 4.2]], segG = [[57.6, 62.0, 2.5, 3.5]], segF = [[62.0, 65.6, 9, 6.5], [72.6, 75.0, 6.5, 0]];
      function update(t, mode, lt) {
        st.setLight(2); st.sem.position.x = 16.5; stopLine.position.x = 15.4; cart.visible = true; rig.compa.visible = false; sparks.userData.update(t, false, V3());
        cans.forEach(o => { o.c.position.set(o.x0, o.y0, o.z0); o.c.rotation.set(0, 0, 0); });
        elotes.forEach(o => { o.e.position.set(o.x0, .9, 0); o.e.rotation.set(0, 0, Math.PI / 2); }); umb.rotation.set(0, 0, 0); elote.rotation.set(0, 0, 0);
        cart.rotation.set(0, 0, 0); rig.steerAt(0); P.torso.rotation.set(0, 0, 0);
        let xr = 0, sol = [], tags = [], g = { fuerza: .2, kmh: 0 };
        const engOn = (on, rate = 1.4) => { mot.updateMatrixWorld(true); const ex = mot.localToWorld(mot.userData.exhaust.clone()); smoke.userData.update(t, on ? rate : 0, ex, V3(-.6 - (g.kmh || 0) * .02, .8, .1)); };
        if (mode === 'amarra') {

          else { K.pose(P, { armR: [-.6 - 1.2 * pull, 0, -.2], elbowR: [-.2, 0, 0], armL: [-.5, 0, .2], elbowL: [-.9, 0, 0], legL: [-.25, 0, 0], legR: [.2, 0, 0], kneeL: [.3, 0, 0], head: [.25, -.3, 0] }); P.torso.rotation.x = .1 + .15 * pull; }
          g = { fuerza: t > T.arranca ? .3 + .05 * Math.sin(t * 20) : 0, kmh: 0 }; engOn(t > T.arranca, 1.6);
          camPath(camera, t, [[-.3, [1.0, 2.3, 4.1], [-.5, 1.15, -.2]], [5.4, [.8, 2.1, 3.5], [-.5, 1.05, -.2]]]);
        } else if (mode === 'nomueve') {

          K.pose(P, { legL: [-2.2, 0, .12], legR: [-2.2, 0, -.12], kneeL: [1.9, 0, 0], kneeR: [1.9, 0, 0], armL: [-.2, 0, 1.0], armR: [-.2, 0, -1.0], elbowL: [-1.4, 0, 0], elbowR: [-1.4, 0, 0], head: [0, Math.sin(t * 6) * .5, 0] });

          camPath(camera, lt, [[-.3, [.2, .75, 1.75], [-.3, .25, .2]], [4.8, [.05, .65, 1.45], [-.3, .22, .2]]]);

          cart.position.set(dd, crash ? Math.max(0, Math.sin((t - T.latas) * 9) * .06 * Math.exp(-(t - T.latas) * 2)) : 0, zz); cart.rotation.y = -.35 * ease(prog(t, 12.4, 13.0)) * (1 - ease(prog(t, 13.2, 13.55)));

          K.pose(P, { legL: [-2.2, 0, .12], legR: [-2.2, 0, -.12], kneeL: [1.9, 0, 0], kneeR: [1.9, 0, 0], armL: [-2.6 * jerk - .6, 0, .3], armR: [-2.6 * jerk - .6, 0, -.3], elbowL: [-.3, 0, 0], elbowR: [-.3, 0, 0] });
          P.torso.rotation.x = -jerk * .9 + (crash ? Math.exp(-(t - T.latas) * 3) * .8 : 0);
          cans.forEach(o => { if (!crash) return; const a = t - T.latas; const y = o.y0 + o.vy * a - 4.9 * a * a; if (y > .06) { o.c.position.set(o.x0 + o.vx * a, y, o.z0 + o.vz * a); o.c.rotation.set(o.sp * a, 0, o.sp * a * .7); } else { const tl = (o.vy + Math.sqrt(o.vy * o.vy + 19.6 * (o.y0 - .06))) / 9.8; o.c.position.set(o.x0 + o.vx * tl + o.vx * .2 * Math.min(1, a - tl), .06, o.z0 + o.vz * tl); o.c.rotation.set(Math.PI / 2, o.sp * .3, 0); } });

          const cx = Math.min(cart.position.x, 6.0);
          camera.position.set(cx + 1.8, 2.0, 3.4 + zz * .5); camera.lookAt(cx - .1, .7, -.8 + zz * .4);
          if (crash) { const a = t - T.latas; camera.position.x += Math.sin(a * 60) * .05 * Math.exp(-a * 4); }
        } else if (mode === 'semaforo') {
          rig.stage(1); st.setLight(0); const xs = 14.0 + 1.2 * easeOut(prog(t, 17.5, 18.2)); cart.position.set(xs, 0, 0); rig.roll(xs, t < T.apaga ? t : 0);
          rig.sit(kid); if (t > T.apaga + .2) K.pose(P, { legL: [-2.2, 0, .12], legR: [-2.2, 0, -.12], kneeL: [1.9, 0, 0], kneeR: [1.9, 0, 0], armR: [-2.4, 0, -.3], elbowR: [-1.9, 0, 0], armL: [-.6, 0, .2], head: [.35, 0, 0] });

      lines.innerHTML = g.speed ? Array.from({ length: 14 }, (_, k) => { const y = 760 + ((k * 97 + 31) % 900), x = ((k * 233 - t * 2600) % 1300 + 1300) % 1300 - 200, w = 120 + (k * 37) % 160; return `<line x1="${x}" y1="${y}" x2="${x + w}" y2="${y}" stroke="#fff" stroke-width="${6 + k % 3 * 2}" stroke-linecap="round" opacity=".85"/>`; }).join('') : '';
      const hits = [T.latas, T.choqueElote].map(h => t - h).filter(a => a >= 0 && a < .7);
      fx.innerHTML = hits.map(a => { const s = 1 + a * 2, o = 1 - a / .7; return Array.from({ length: 8 }, (_, k) => { const an = k * Math.PI / 4, r1 = 60 * s, r2 = 130 * s; return `<line x1="${540 + Math.cos(an) * r1}" y1="${1150 + Math.sin(an) * r1}" x2="${540 + Math.cos(an) * r2}" y2="${1150 + Math.sin(an) * r2}" stroke="#FFE14A" stroke-width="14" stroke-linecap="round" opacity="${o}"/>`; }).join(''); }).join('');
    }
