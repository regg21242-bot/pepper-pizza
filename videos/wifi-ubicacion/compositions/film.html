<template>
  <style>
    #root { position: absolute; inset: 0; background: #120E2A; overflow: hidden; font-family: Nunito, sans-serif; }
    #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
    #gl, #hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    #pill { position: absolute; padding: 8px 30px; border-radius: 40px; border: 4px solid #FF2E3A; background: rgba(40,6,12,.75); color: #FF4A55; font-family: Nunito, sans-serif; font-weight: 900; font-size: 54px; letter-spacing: 3px; transform: translate(-50%, -100%); box-shadow: 0 0 24px rgba(255,46,58,.5); }
    #pill i { position: absolute; left: 14px; right: 14px; top: 50%; height: 7px; background: #FF2E3A; border-radius: 4px; transform-origin: 0 50%; transform: rotate(-12deg) scaleX(0); }
  </style>
  <div id="root" data-composition-id="film" data-start="0" data-duration="58" data-width="1080" data-height="1920">
    <div id="stage" data-layout-ignore><canvas id="gl" width="1080" height="1920" data-layout-ignore></canvas><canvas id="hud" width="1080" height="1920" data-layout-ignore></canvas>
    <div id="pill" data-layout-ignore><span>GPS</span><i></i></div></div>
    <div id="flash" data-layout-ignore></div>
  </div>
  <script>
  (function () {
    /* ¿Tu celular sabe dónde estás sin GPS? — serie "Nunca te lo explicaron" (assets/lib/nunca.js) */
    const N = window.N, THREE = N.THREE, { clamp, lerp, prog, ease, easeOut } = N;
    const W = 1080, H = 1920;
    const renderer = N.crearRender(document.getElementById('gl'), W, H);
    const cam = (fov = 40) => new THREE.PerspectiveCamera(fov, W / H, .05, 1200);
    function camPath(c, t, keys) { let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++; const [t0, p0, l0] = keys[i], [t1, p1, l1] = keys[Math.min(i + 1, keys.length - 1)]; const k = t1 > t0 ? ease(prog(t, t0, t1)) : 0; c.position.set(lerp(p0[0], p1[0], k), lerp(p0[1], p1[1], k), lerp(p0[2], p1[2], k)); c.lookAt(lerp(l0[0], l1[0], k), lerp(l0[1], l1[1], k), lerp(l0[2], l1[2], k)); }
    const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
    const bokeh = (s, seed = 3) => { const g = new THREE.Group(); const r = N.rng(seed); for (let i = 0; i < 40; i++) { const sp = N.glow(['#6A4AFF', '#3AB8FF', '#FF8A3A'][i % 3], .5 + r() * 2.2, .25 + r() * .3); sp.position.set((r() - .5) * 14, (r() - .5) * 22, -6 - r() * 8); g.add(sp); } s.add(g); return g; };

    /* ======== 1: celular girando y despiezado (escena principal) ======== */
    const PHONE = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#0A1030'); s.environment = window.CEL.estudio(renderer);
      s.add(new THREE.HemisphereLight('#B8C8FF', '#141428', .8));
      const key = new THREE.DirectionalLight('#FFF4E8', 3.4); key.position.set(.6, 6, 2.5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); const kc = key.shadow.camera; kc.left = kc.bottom = -2; kc.right = kc.top = 2; kc.near = .5; kc.far = 12; key.shadow.bias = -.0004; key.shadow.normalBias = .01; key.shadow.radius = 6; s.add(key, key.target);
      const rim = new THREE.DirectionalLight('#5CA8FF', 2.6); rim.position.set(-2, 1.5, -4); s.add(rim);
      const rim2 = new THREE.DirectionalLight('#7A6AFF', 1.2); rim2.position.set(3, -1, -3); s.add(rim2);
      // bokeh y polvo
      const r = N.rng(3); for (let i = 0; i < 34; i++) { const sp = N.glow(['#3A5AFF', '#3AB8FF', '#8A6AFF', '#FF9A5A'][i % 4], .4 + r() * 1.6, .18 + r() * .25); sp.position.set((r() - .5) * 9, (r() - .5) * 14, -5 - r() * 6); s.add(sp); }
      const NP = 400, dpos = new Float32Array(NP * 3), dbase = []; for (let i = 0; i < NP; i++) dbase.push([(r() - .5) * 6, (r() - .5) * 9, (r() - .5) * 4 - 1, r()]);
      const dgeo = new THREE.BufferGeometry(); dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3)); s.add(new THREE.Points(dgeo, new THREE.PointsMaterial({ color: '#CFE0FF', size: .012, transparent: true, opacity: .55, depthWrite: false })));
      const ph = window.CEL.crear(renderer); const holder = new THREE.Group(); holder.add(ph); s.add(holder); const P = ph.userData; holder.rotation.order = 'YXZ';
      // anillo rojo punteado que gira alrededor del chip GPS
      const ringT = N.canvasTex(256, 256, (x) => { x.strokeStyle = '#FF2E3A'; x.lineWidth = 10; x.setLineDash([20, 14]); x.lineCap = 'round'; x.beginPath(); x.arc(128, 128, 112, 0, 7); x.stroke(); }, false);
      const ring = new THREE.Sprite(new THREE.SpriteMaterial({ map: ringT, transparent: true, depthTest: false, toneMapped: false })); ring.renderOrder = 30; s.add(ring);
      const redGlow = N.glow('#FF2A2A', .3, 0); s.add(redGlow);
      const camera = cam(30);
      const backOut = (k) => { k = clamp(k); const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
      function update(t, lt) {
        // polvo flotando
        dbase.forEach((d, i) => dpos.set([d[0] + Math.sin(t * .3 + d[3] * 9) * .1, ((d[1] + t * .05 * (d[3] + .3)) % 9 + 9) % 9 - 4.5, d[2]], i * 3)); dgeo.attributes.position.needsUpdate = true;
        // 0–0.8 gira de pie · 0.8–2.0 se inclina y se separa en torre (ease-out + rebote) · 3–4 GPS · 4–5 se junta
        const tilt = easeOut(prog(lt, .8, 1.6));
        const sep = lt < 4.1 ? backOut(prog(lt, .9, 2.0)) : 1 - ease(prog(lt, 4.1, 4.8));
        P.despiece(Math.max(0, sep), 1);
        holder.rotation.set(lerp(0, -Math.PI / 2 + .18, tilt), lerp(lt * .9 - .6, .7, tilt) + (lt > 2 ? (lt - 2) * .1 : 0), 0);
        ph.rotation.set(0, 0, 0);
        // chip GPS
        const out = ease(prog(lt, 3.0, 3.35)) * (1 - ease(prog(lt, 4.1, 4.45)));
        P.gpsSale(out);
        const blink = lt > 3.3 && lt < 3.75 ? (Math.sin((lt - 3.3) * Math.PI * 4.45) > 0 ? 1 : 0) : 0, off = lt >= 3.75;
        P.gpsBrillo(blink || (lt > 3.0 && lt < 3.4 ? .5 : 0), off);
        holder.updateMatrixWorld(true); const gw = P.gps.getWorldPosition(new THREE.Vector3());
        const rk = clamp((lt - 3.05) / .3) * (1 - ease(prog(lt, 4.1, 4.35)));
        ring.position.copy(gw); ring.scale.setScalar(.34 * (.6 + .4 * rk)); ring.material.rotation = -lt * 2.2; ring.material.opacity = rk * (off ? .75 : 1);
        redGlow.position.copy(gw); redGlow.material.opacity = blink * .9; redGlow.scale.setScalar(.35);
        // cámara: frontal → acercamiento y órbita de 25° → sale
        const orb = ease(prog(lt, 2.0, 3.2)) * .45, dist = lerp(lerp(5.6, 11.5, tilt), 9.0, ease(prog(lt, 2.0, 3.2))) + ease(prog(lt, 4.0, 5.0)) * 2.0;
        const elev = lerp(.1, .4, tilt);
        camera.position.set(Math.sin(orb) * dist * Math.cos(elev), Math.sin(elev) * dist, Math.cos(orb) * dist * Math.cos(elev));
        const look = new THREE.Vector3(0, .05, 0).lerp(gw, .35 * rk); camera.lookAt(look);
        camera.updateMatrixWorld(); const v = gw.clone().project(camera);
        return { gps: rk > .05 ? { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H, k: rk, tach: ease(prog(lt, 3.75, 3.95)) } : null };
      }
      return { scene: s, camera, update };
    })();

    /* tiempos (s) — tools/mezcla.py también los lee */
    const T = { cuts: [5.0, 12.0, 14.6, 21.4, 27.6, 35.4, 41.8, 45.2, 57.2], end: 58, voz: [0.3, 5.2, 12.3, 14.8, 21.6, 27.8, 35.6, 42.0, 45.4, 52.8],
      gpsBloq: 6.4, mapa: 9.2, punto: 9.7, wifi: 13.1, grita: 15.2, escucha: 18.9, sinPass: 20.2, filas: 21.8, nube: 23.1, mapa2: 24.4, pin: 26.6,
      millones: 29.6, suben: 30.8, cierra: 35.7, llave: 36.2, f1: 36.6, f2: 37.0, f3: 37.4, soloNombre: 38.6, letrero: 40.6, planeta: 41.9, cuenta: 42.6,
      casa: 46.2, desconocido: 48.9, pregunta: 52.7, util: 53.7, miedo: 54.5 };
    const UP = V3(0, 1, 0), beamGeo = new THREE.CylinderGeometry(1, 1, 1, 8, 1, true);
    function setBeam(mesh, a, b, r) { const d = b.clone().sub(a), L = d.length(); mesh.position.copy(a).addScaledVector(d, .5); mesh.quaternion.setFromUnitVectors(UP, d.normalize()); mesh.scale.set(r, L, r); }
    function satelite() { const g = new THREE.Group(), gold = N.std('#D8A840', { metalness: .8, roughness: .3, flatShading: false });
      g.add(N.box(1.4, 1.4, 2, gold)); const pm = N.std('#2A4AB0', { metalness: .4, roughness: .35, flatShading: false, emissive: '#0A1A50' });
      for (const s of [-1, 1]) { g.add(N.box(3.6, .07, 1.3, pm, s * 2.7, 0, 0)); g.add(N.box(.9, .1, .1, '#C8C8D0', s * 1.15, 0, 0)); for (let k = 1; k < 4; k++) g.add(N.box(.03, .09, 1.32, '#8AA0E0', s * (.9 + k * .9), 0, 0)); }
      const dish = N.M(new THREE.ConeGeometry(.6, .45, 18, 1, true), N.std('#E8E8F0', { side: THREE.DoubleSide, flatShading: false }), 0, -.95, 0); g.add(dish); return g; }

    /* ======== 2: centro comercial — el GPS no entra ======== */
    const MALL = (() => {
      const s = new THREE.Scene(); N.atardecer(s, { near: 70, far: 220 });
      const mall = N.centroComercial(); s.add(mall);
      s.add(N.box(24.6, 12.4, .4, '#D8D2C8', 0, 6.2, -7));
      const chica = N.persona('#7A4FC0', { capucha: true, coleta: true, pelo: '#2A1A14' }); chica.position.set(2.5, 4.2, 1.5); chica.rotation.y = .5; s.add(chica); chica.userData.camina(0, 0);
      const halo = N.glow('#7FE8FF', .7, .8); s.add(halo);
      [['#E8B84A', -6, 0.2, 2], ['#3A9A6A', 7, 4.2, -1], ['#C8403A', -3, 8.2, 0], ['#3A7AE0', 6, 0.2, 3]].forEach(([c, x, y, z], i) => { const p = N.persona(c, { piel: ['#C68D68', '#E0B090', '#A87050'][i % 3] }); p.position.set(x, y, z); p.rotation.y = i % 2 ? -1.2 : 1.2; p.userData.camina(i * 1.3, .6); s.add(p); });
      const sat = satelite(); sat.position.set(-7, 30, -4); sat.rotation.set(.3, .6, .2); s.add(sat);
      const S0 = V3(-7, 29, -4), HIT = V3(0.5, 12.6, 0);
      const pulses = [...Array(8)].map(() => { const g = N.glow('#FFD25A', 1.3, 0); s.add(g); return g; });
      const beam = new THREE.Mesh(beamGeo, N.glowM('#FFD25A', .25)); setBeam(beam, S0, HIT, .08); s.add(beam);
      const spark = N.glow('#FF3A3A', 4, 0); spark.position.copy(HIT); s.add(spark);
      const xt = N.canvasTex(256, 256, (x) => { x.strokeStyle = '#FF3A46'; x.lineWidth = 34; x.lineCap = 'round'; x.beginPath(); x.moveTo(50, 50); x.lineTo(206, 206); x.moveTo(206, 50); x.lineTo(50, 206); x.stroke(); }, false);
      const equis = new THREE.Sprite(new THREE.SpriteMaterial({ map: xt, transparent: true, depthTest: false, toneMapped: false })); equis.position.copy(HIT).add(V3(0, 1.4, 0)); equis.renderOrder = 20; s.add(equis);
      const camera = cam(40);
      function update(t, lt) {
        const on = prog(lt, .4, .9);
        pulses.forEach((g, i) => { const u = (lt * .8 + i / 8) % 1; g.position.lerpVectors(S0, HIT, u); g.material.opacity = on * Math.min(1, (1 - u) * 6, u * 6) * .9; });
        beam.material.opacity = .22 * on;
        const hit = lt > T.gpsBloq - 5 - .5; spark.material.opacity = hit ? .5 + .4 * Math.sin(lt * 40) : 0;
        const xk = N.easeOut(prog(t, T.gpsBloq, T.gpsBloq + .3)); equis.scale.setScalar(2.6 * xk * (1 + .15 * Math.sin(prog(t, T.gpsBloq, T.gpsBloq + .6) * Math.PI))); equis.material.opacity = xk;
        sat.rotation.y = .6 + lt * .15;
        chica.updateMatrixWorld(true); halo.position.copy(chica.userData.phone.getWorldPosition(V3())); halo.material.opacity = .6 + .3 * Math.sin(t * 5);
        camPath(camera, lt, [[0, [0, 16, 50], [0, 15, 0]], [2.6, [0, 15, 46], [0, 13.5, 0]], [4.0, [3.6, 7.2, 13.5], [3.8, 5.4, 0]], [7, [3.2, 6.9, 12], [3.6, 5.3, 0]]]);
        return {};
      }
      return { scene: s, camera, update };
    })();

    /* ======== 3,4,6,9: la calle (sube, ondas, gente, casa) ======== */
    const CALLE = (() => {
      const s = new THREE.Scene(); N.atardecer(s, { near: 34, far: 160 });
      const st = N.calle(); s.add(st); st.userData.casas.forEach(b => { if (b.position.z > 0) b.scale.y = .12; });
      st.updateMatrixWorld(true); const wpos = m => m.getWorldPosition(V3());
      const modems = st.userData.modems.filter(m => m.parent.position.z < 0);
      const casaM = modems.filter(m => wpos(m).y < 3).sort((a, b) => Math.abs(wpos(a).x - 6) - Math.abs(wpos(b).x - 6))[0];
      const ond = modems.map((m, i) => { const o = N.ondas(3); s.add(o); const r = N.rng(30 + i); const hx = () => '0123456789ABCDEF'[Math.floor(r() * 16)];
        const lbl = N.etiqueta(`RED-${hx()}${hx()}${hx()}${hx()}`, { s: 2.0 }); s.add(lbl); return { m, o, lbl, ph: r(), w: wpos(m), i }; });
      const chica = N.persona('#7A4FC0', { capucha: true, coleta: true, pelo: '#2A1A14' }); s.add(chica); const CP = chica.userData;
      const people = ['#E8B84A', '#3A9A6A', '#C8403A', '#3A7AE0', '#F2EEE6'].map((c, i) => { const p = N.persona(c, { piel: ['#C68D68', '#E0B090', '#A87050'][i % 3] }); s.add(p); return p; });
      const extra = [...Array(12)].map((_, i) => { const p = N.persona(['#E86A4A', '#4AB0A0', '#E8D07A', '#5A6AE0', '#C85A9A', '#7AC05A'][i % 6], { piel: ['#C68D68', '#E0B090', '#A87050', '#8A5A40'][i % 4], coleta: i % 3 === 0, pelo: ['#1E1A18', '#5A3A20', '#2A2A2A'][i % 3] }); s.add(p); return p; });
      const halos = extra.map(() => { const g = N.glow('#9FF4FF', 1.1, 0); s.add(g); return g; });
      const sats = [[-15, 23, -18], [1, 26, -22], [16, 22, -16]].map(([x, y, z], i) => { const g = satelite(); g.position.set(x, y, z); g.rotation.set(.3, i, .2); s.add(g); return g; });
      const gold = [...Array(12)].map(() => { const g = N.glow('#FFD25A', .9, 0); s.add(g); return g; });
      const goldB = [...Array(12)].map(() => { const b = new THREE.Mesh(beamGeo, N.glowM('#FFD25A', .2)); s.add(b); return b; });
      const coords = ['24.14°N', '24.15°N', '24.13°N', '24.16°N'];
      const ups = [...Array(8)].map((_, j) => { const r = N.rng(70 + j); const hx = () => '0123456789ABCDEF'[Math.floor(r() * 16)]; const l = N.etiqueta(`${hx()}${hx()}${hx()}${hx()} + ${coords[j % 4]}`, { s: 1.1, w: 640, fs: 54, border: 'rgba(255,210,90,.9)' }); s.add(l); return l; });
      const cyanB = [...Array(24)].map(() => { const b = new THREE.Mesh(beamGeo, N.glowM('#7FF0FF', .5)); s.add(b); return b; });
      const extranio = N.persona('#5A5E6A', { capucha: true, pelo: '#26262A', pantalon: '#1E2230', piel: '#B88060' }); s.add(extranio);
      const exHalo = N.glow('#9FF4FF', .5, 0); s.add(exHalo);
      const casaLbl = N.etiqueta('ESTOY AQUÍ', { s: .55, w: 512, fs: 64 }); s.add(casaLbl);
      const pinT = N.canvasTex(128, 160, (x) => { x.fillStyle = '#FF4A5A'; x.beginPath(); x.arc(64, 58, 50, Math.PI, 0); x.quadraticCurveTo(114, 100, 64, 156); x.quadraticCurveTo(14, 100, 14, 58); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(64, 58, 20, 0, 7); x.fill(); }, false);
      const pin = new THREE.Sprite(new THREE.SpriteMaterial({ map: pinT, transparent: true, depthTest: false, toneMapped: false })); pin.renderOrder = 15; s.add(pin);
      const camera = cam(46);
      function update(t, lt, m) {
        const gente = m === 'gente', casa = m === 'casa', cx = -2 + (t - 12) * .9;
        chica.visible = !casa; chica.position.set(cx, .25, 4.2); chica.rotation.y = Math.PI / 2; CP.camina(t * 6);
        people.forEach((p, i) => { const dir = i % 2 ? 1 : -1; p.position.set(((i * 13 + t * 1.2 * dir) % 60 + 60) % 60 - 30, .25, dir > 0 ? 5.6 : -5.2); p.rotation.y = dir * Math.PI / 2; p.userData.camina(t * 6 + i); });
        const camX = gente ? 6 + lt * .35 : 0;
        extra.forEach((p, i) => { p.visible = gente; halos[i].material.opacity = 0; if (!gente) return; const dir = i % 2 ? 1 : -1, lane = [4.6, 5.5, 6.6, -4.8, -5.8, -6.8][i % 6];
          p.position.set(camX + ((i * 5.3 + t * 1.1 * dir) % 26 + 26) % 26 - 13, .25, lane); p.rotation.y = dir * Math.PI / 2; p.userData.camina(t * 6 + i * 1.3);
          p.updateMatrixWorld(true); halos[i].position.copy(p.userData.phone.getWorldPosition(V3())); halos[i].material.opacity = (.5 + .3 * Math.sin(t * 4 + i)) * prog(t, T.millones - .3, T.millones + .3); });
        sats.forEach((g, i) => { g.visible = gente; g.rotation.y = t * .25 + i; });
        // ondas wifi
        const wk = m === 'sube' ? N.easeOut(prog(t, T.wifi - .3, T.wifi + .4)) : gente ? .45 : 1;
        ond.forEach(({ m: mm, o, lbl, ph: p0, w, i }) => { const k = casa ? (mm === casaM ? 1 : 0) : wk; o.visible = k > .01; o.position.copy(w).add(V3(0, .6, 0)); o.userData.update(t + p0 * 2, k, casa ? 2.6 : 9);
          const lk = m === 'ondas' ? N.easeOut(prog(t, T.grita + (i % 8) * .13, T.grita + .35 + (i % 8) * .13)) : 0; lbl.visible = lk > .01; lbl.material.opacity = lk; lbl.position.copy(w).add(V3(0, 3.6 + (1 - lk) * 1.5, 0));
          mm.userData.leds.forEach((l, j) => l.visible = Math.sin(t * 8 + j * 1.7 + p0 * 9) > -.3); });
        // líneas cian: módems → celular de la chica
        chica.updateMatrixWorld(true); const ph = CP.phone.getWorldPosition(V3());
        let nb = 0; cyanB.forEach(b => b.visible = false);
        if (m === 'ondas' && t > T.escucha - .3) ond.forEach(({ w }, i) => { if (nb >= cyanB.length || w.distanceTo(ph) > 26) return; const b = cyanB[nb++]; const k = N.easeOut(prog(t, T.escucha - .3 + nb * .08, T.escucha + .1 + nb * .08)); if (k <= 0) return; b.visible = true; const a = w.clone().add(V3(0, .4, 0)); setBeam(b, a, a.clone().lerp(ph, k), .07); b.material.opacity = .55 + .25 * Math.sin(t * 9 + i); });
        // gente: satélites → celulares (oro) y datos que suben
        gold.forEach(g => g.material.opacity = 0); goldB.forEach(b => b.visible = false); ups.forEach(l => l.visible = false);
        if (gente) { extra.forEach((p, i) => { if (i >= 12) return; const pp = halos[i].position, sp = sats[i % 3].position; const k = prog(t, T.millones + i * .05, T.millones + .4 + i * .05); if (k <= 0) return;
            goldB[i].visible = true; setBeam(goldB[i], sp, pp, .05); goldB[i].material.opacity = .22 * k; const u = (t * .7 + i * .21) % 1; gold[i].position.lerpVectors(sp, pp, u); gold[i].material.opacity = k * Math.min(1, (1 - u) * 5, u * 5); });
          ups.forEach((l, j) => { if (t < T.suben) return; const u = ((t - T.suben) * .42 + j * .37) % 1, p = extra[j]; const base = halos[j].position; l.visible = true; l.position.set(base.x, base.y + .8 + u * 15, base.z); l.material.opacity = Math.sin(Math.PI * u) * prog(t, T.suben, T.suben + .5); }); }
        // casa: el módem le dice a un desconocido dónde está
        extranio.visible = exHalo.visible = casaLbl.visible = pin.visible = casa;
        if (casa) { const w = casaM.getWorldPosition(V3()); extranio.position.set(w.x - 6.5 + lt * 1.05, .25, w.z + 2.4); extranio.rotation.y = Math.PI / 2; extranio.userData.camina(t * 6);
