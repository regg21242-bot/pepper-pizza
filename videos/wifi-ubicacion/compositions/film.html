    /* ---------- un cuadro ---------- */
    const pill = document.getElementById('pill');
    function renderAt(t) {

        mv.set(v.x * .5, v.y * .5).multiplyScalar(-.75); if (mv.length() < .004) mv.set(0, 0); const lim = t > 42.2 && t < 45.8 ? .05 : .2; if (mv.length() > lim) mv.setLength(lim); }
