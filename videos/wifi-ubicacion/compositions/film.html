<template>
  <style>
    #root { position: absolute; inset: 0; background: #120E2A; overflow: hidden; font-family: Nunito, sans-serif; }
    #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
    #pill { position: absolute; padding: 8px 30px; border-radius: 40px; border: 4px solid #FF2E3A; background: rgba(40,6,12,.75); color: #FF4A55; font-family: Nunito, sans-serif; font-weight: 900; font-size: 54px; letter-spacing: 3px; transform: translate(-50%, -100%); box-shadow: 0 0 24px rgba(255,46,58,.5); }
    #pill i { position: absolute; left: 14px; right: 14px; top: 50%; height: 7px; background: #FF2E3A; border-radius: 4px; transform-origin: 0 50%; transform: rotate(-12deg) scaleX(0); }
  </style>
  <div id="root" data-composition-id="film" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <canvas id="gl" width="1080" height="1920" data-layout-ignore></canvas>
    <div id="pill" data-layout-ignore><span>GPS</span><i></i></div>
  </div>
  <script>
  (function () {
    /* ¿Tu celular sabe dónde estás sin GPS? — serie "Nunca te lo explicaron" (assets/lib/nunca.js) */
    const N = window.N, THREE = N.THREE, { clamp, lerp, prog, ease, easeOut } = N;
    const W = 1080, H = 1920;
    const renderer = N.crearRender(document.getElementById('gl'), W, H);
    const cam = (fov = 40) => new THREE.PerspectiveCamera(fov, W / H, .05, 1200);
    function camPath(c, t, keys) { let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++; const [t0, p0, l0] = keys[i], [t1, p1, l1] = keys[Math.min(i + 1, keys.length - 1)]; const k = t1 > t0 ? ease(prog(t, t0, t1)) : 0; c.position.set(lerp(p0[0], p1[0], k), lerp(p0[1], p1[1], k), lerp(p0[2], p1[2], k)); c.lookAt(lerp(l0[0], l1[0], k), lerp(l0[1], l1[1], k), lerp(l0[2], l1[2], k)); }
    const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
    const bokeh = (s, seed = 3) => { const g = new THREE.Group(); const r = N.rng(seed); for (let i = 0; i < 40; i++) { const sp = N.glow(['#6A4AFF', '#3AB8FF', '#FF8A3A'][i % 3], .5 + r() * 2.2, .25 + r() * .3); sp.position.set((r() - .5) * 14, (r() - .5) * 22, -6 - r() * 8); g.add(sp); } s.add(g); return g; };

    /* ======== 1: celular girando y despiezado (escena principal) ======== */
    const PHONE = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#0A1030'); s.environment = window.CEL.estudio(renderer);
      s.add(new THREE.HemisphereLight('#B8C8FF', '#141428', .8));
      const key = new THREE.DirectionalLight('#FFF4E8', 3.4); key.position.set(.6, 6, 2.5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); const kc = key.shadow.camera; kc.left = kc.bottom = -2; kc.right = kc.top = 2; kc.near = .5; kc.far = 12; key.shadow.bias = -.0004; key.shadow.normalBias = .01; key.shadow.radius = 6; s.add(key, key.target);
      const rim = new THREE.DirectionalLight('#5CA8FF', 2.6); rim.position.set(-2, 1.5, -4); s.add(rim);
      const rim2 = new THREE.DirectionalLight('#7A6AFF', 1.2); rim2.position.set(3, -1, -3); s.add(rim2);
      // bokeh y polvo
      const r = N.rng(3); for (let i = 0; i < 34; i++) { const sp = N.glow(['#3A5AFF', '#3AB8FF', '#8A6AFF', '#FF9A5A'][i % 4], .4 + r() * 1.6, .18 + r() * .25); sp.position.set((r() - .5) * 9, (r() - .5) * 14, -5 - r() * 6); s.add(sp); }
      const NP = 400, dpos = new Float32Array(NP * 3), dbase = []; for (let i = 0; i < NP; i++) dbase.push([(r() - .5) * 6, (r() - .5) * 9, (r() - .5) * 4 - 1, r()]);
      const dgeo = new THREE.BufferGeometry(); dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3)); s.add(new THREE.Points(dgeo, new THREE.PointsMaterial({ color: '#CFE0FF', size: .012, transparent: true, opacity: .55, depthWrite: false })));
      const ph = window.CEL.crear(renderer); const holder = new THREE.Group(); holder.add(ph); s.add(holder); const P = ph.userData; holder.rotation.order = 'YXZ';
      // anillo rojo punteado que gira alrededor del chip GPS
      const ringT = N.canvasTex(256, 256, (x) => { x.strokeStyle = '#FF2E3A'; x.lineWidth = 10; x.setLineDash([20, 14]); x.lineCap = 'round'; x.beginPath(); x.arc(128, 128, 112, 0, 7); x.stroke(); }, false);
      const ring = new THREE.Sprite(new THREE.SpriteMaterial({ map: ringT, transparent: true, depthTest: false, toneMapped: false })); ring.renderOrder = 30; s.add(ring);
      const redGlow = N.glow('#FF2A2A', .3, 0); s.add(redGlow);
      const camera = cam(30);
      const backOut = (k) => { k = clamp(k); const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
      function update(t, lt) {
        // polvo flotando
        dbase.forEach((d, i) => dpos.set([d[0] + Math.sin(t * .3 + d[3] * 9) * .1, ((d[1] + t * .05 * (d[3] + .3)) % 9 + 9) % 9 - 4.5, d[2]], i * 3)); dgeo.attributes.position.needsUpdate = true;
        // 0–0.8 gira de pie · 0.8–2.0 se inclina y se separa en torre (ease-out + rebote) · 3–4 GPS · 4–5 se junta
        const tilt = easeOut(prog(lt, .8, 1.6));
        const sep = lt < 4.1 ? backOut(prog(lt, .9, 2.0)) : 1 - ease(prog(lt, 4.1, 4.8));
        P.despiece(Math.max(0, sep), 1);
        holder.rotation.set(lerp(0, -Math.PI / 2 + .18, tilt), lerp(lt * .9 - .6, .7, tilt) + (lt > 2 ? (lt - 2) * .1 : 0), 0);
        ph.rotation.set(0, 0, 0);
        // chip GPS
        const out = ease(prog(lt, 3.0, 3.35)) * (1 - ease(prog(lt, 4.1, 4.45)));
        P.gpsSale(out);
        const blink = lt > 3.3 && lt < 3.75 ? (Math.sin((lt - 3.3) * Math.PI * 4.45) > 0 ? 1 : 0) : 0, off = lt >= 3.75;
        P.gpsBrillo(blink || (lt > 3.0 && lt < 3.4 ? .5 : 0), off);
        holder.updateMatrixWorld(true); const gw = P.gps.getWorldPosition(new THREE.Vector3());
        const rk = clamp((lt - 3.05) / .3) * (1 - ease(prog(lt, 4.1, 4.35)));
        ring.position.copy(gw); ring.scale.setScalar(.34 * (.6 + .4 * rk)); ring.material.rotation = -lt * 2.2; ring.material.opacity = rk * (off ? .75 : 1);
        redGlow.position.copy(gw); redGlow.material.opacity = blink * .9; redGlow.scale.setScalar(.35);
        // cámara: frontal → acercamiento y órbita de 25° → sale
        const orb = ease(prog(lt, 2.0, 3.2)) * .45, dist = lerp(lerp(5.6, 11.5, tilt), 9.0, ease(prog(lt, 2.0, 3.2))) + ease(prog(lt, 4.0, 5.0)) * 2.0;
        const elev = lerp(.1, .4, tilt);
        camera.position.set(Math.sin(orb) * dist * Math.cos(elev), Math.sin(elev) * dist, Math.cos(orb) * dist * Math.cos(elev));
        const look = new THREE.Vector3(0, .05, 0).lerp(gw, .35 * rk); camera.lookAt(look);
        camera.updateMatrixWorld(); const v = gw.clone().project(camera);
        return { gps: rk > .05 ? { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H, k: rk, tach: ease(prog(lt, 3.75, 3.95)) } : null };
      }
      return { scene: s, camera, update };
    })();

    /* ======== 4: la calle con ondas WiFi y etiquetas ======== */
    const CALLE = (() => {
      const s = new THREE.Scene(); N.atardecer(s, { near: 30, far: 140 });
      const st = N.calle(); s.add(st); st.userData.casas.forEach(b => { if (b.position.z > 0) b.scale.y = .12; }); const modems = st.userData.modems.filter(m => m.parent.position.z < 0);   // la fila de enfrente queda bajita para que se vea la calle
      const ond = modems.map((m, i) => { const o = N.ondas(3); s.add(o); const r = N.rng(30 + i); const hx = () => '0123456789ABCDEF'[Math.floor(r() * 16)]; const lbl = N.etiqueta(`${hx()}${hx()}:${hx()}${hx()}:${hx()}${hx()}…`, { s: 2.0 }); s.add(lbl); return { m, o, lbl, ph: r() }; });
      const chica = N.persona('#7A4FC0', { capucha: true, coleta: true, pelo: '#2A1A14' }); s.add(chica); const CP = chica.userData;
      const people = ['#E8B84A', '#3A9A6A', '#C8403A', '#3A7AE0', '#F2EEE6'].map((c, i) => { const p = N.persona(c, { piel: ['#C68D68', '#E0B090', '#A87050'][i % 3] }); s.add(p); return p; });
      const lines = new THREE.Group(); s.add(lines); const lineM = new THREE.LineBasicMaterial({ color: '#7FF0FF', transparent: true, opacity: .55, toneMapped: false });
      const camera = cam(46);
      function update(t, lt) {
        chica.position.set(-2 + lt * .9, .25, 4.2); chica.rotation.y = Math.PI / 2; CP.camina(t * 6);
        people.forEach((p, i) => { const dir = i % 2 ? 1 : -1; p.position.set(((i * 13 + t * 1.2 * dir) % 60 + 60) % 60 - 30, .25, dir > 0 ? 5.6 : -5.2); p.rotation.y = dir * Math.PI / 2; p.userData.camina(t * 6 + i); });
        chica.updateMatrixWorld(true); const ph = CP.phone.getWorldPosition(V3());
        while (lines.children.length) lines.remove(lines.children[0]);
        ond.forEach(({ m, o, lbl, ph: p0 }) => { m.updateMatrixWorld(true); const w = m.getWorldPosition(V3()); o.position.copy(w).add(V3(0, .6, 0)); o.userData.update(t + p0 * 2, 1, 9); lbl.position.copy(w).add(V3(0, 3.6, 0));
          const d = w.distanceTo(ph); const vis = d < 40; o.visible = lbl.visible = vis; m.userData.leds.forEach((l, j) => l.visible = Math.sin(t * 8 + j * 1.7 + p0 * 9) > -.3);
          if (vis && d < 24) { const g = new THREE.BufferGeometry().setFromPoints([w.clone().add(V3(0, .4, 0)), ph]); lines.add(new THREE.Line(g, lineM)); } });
        camPath(camera, lt, [[-.3, [lt * .9 + 6, 11, 18], [lt * .9 - 1, 2, 0]], [5, [lt * .9 + 6, 11, 18], [lt * .9 - 1, 2, 0]]]);
        camera.position.set(chica.position.x - 14, 48, 34); camera.lookAt(chica.position.x + 3, 0, -6);
        return {};
      }
      return { scene: s, camera, update };
    })();

    /* ======== 8: zoom out hasta el planeta ======== */
    const GLOBO = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#070818');
      s.add(new THREE.HemisphereLight('#9AB0FF', '#100818', .9)); const sun = new THREE.DirectionalLight('#FFC090', 2.2); sun.position.set(-4, 3, 8); s.add(sun);
      const r = N.rng(2); const stars = new THREE.BufferGeometry(); const sp = new Float32Array(1500 * 3); for (let i = 0; i < 1500; i++) { const v = V3(r() - .5, r() - .5, r() - .5).normalize().multiplyScalar(300); sp.set([v.x, v.y, v.z], i * 3); } stars.setAttribute('position', new THREE.BufferAttribute(sp, 3)); s.add(new THREE.Points(stars, new THREE.PointsMaterial({ color: '#FFFFFF', size: 1.2, sizeAttenuation: false })));
      const pl = N.planeta(7000); s.add(pl);
      const camera = cam(38);
      function update(t, lt) { pl.rotation.y = -1.9 + lt * .05; pl.rotation.x = .25;
        const d = lerp(18, 38, ease(prog(lt, 0, 4))); camera.position.set(0, 0, d); camera.lookAt(0, 0, 0); return {}; }
      return { scene: s, camera, update };
    })();

    const SC = [{ a: 0, b: 99, s: PHONE }];   // por ahora solo la escena 1 (aprobación)
    const pill = document.getElementById('pill');
    function renderAt(t) { const sc = SC.find(x => t >= x.a && t < x.b) || SC[SC.length - 1]; const g = sc.s.update(t, t - sc.a) || {}; renderer.render(sc.s.scene, sc.s.camera);
      if (g.gps) { pill.style.display = 'block'; pill.style.left = Math.min(820, g.gps.x + 40) + 'px'; pill.style.top = (g.gps.y - 90) + 'px'; pill.style.opacity = g.gps.k; pill.querySelector('i').style.transform = `rotate(-12deg) scaleX(${g.gps.tach})`; } else pill.style.display = 'none'; }
    window.addEventListener('hf-seek', e => renderAt(e.detail.time));
    renderAt(0);
    window.__timelines = window.__timelines || {};
    window.__timelines['film'] = gsap.timeline({ paused: true });
  })();
  </script>
</template>
