<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#1C2340}</style>
<script src="../assets/lib/three.min.js"></script>
<script src="../assets/lib/personajes.js"></script>
</head><body>
<canvas id="gl"></canvas>
<script>
const P = window.PUEBLO_P, THREE = window.THREE, E = P.ESC;
const CW = 1000, CH = 1080, COLS = 3, W = CW * COLS, H = CH * 3;
const gl = document.getElementById('gl'); gl.width = W; gl.height = H;
const R = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true }); R.setSize(W, H, false); R.setPixelRatio(1);
R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.LinearToneMapping; R.toneMappingExposure = .85; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.setScissorTest(true); R.autoClear = true;
const out = document.createElement('canvas'); out.width = W; out.height = H; const X = out.getContext('2d'); X.fillStyle = '#1C2340'; X.fillRect(0, 0, W, H);
function escena() { const s = new THREE.Scene(); s.background = new THREE.Color('#1C2340');
  s.add(new THREE.HemisphereLight('#AFC0FF', '#2A2030', .28));
  const key = new THREE.DirectionalLight('#FFE6C8', 2.3); key.position.set(3, 4.2, 3.2); key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -.0002; key.shadow.normalBias = .012; const c = key.shadow.camera; c.left = c.bottom = -1.4; c.right = c.top = 1.4; c.near = .5; c.far = 12; s.add(key);
  const fill = new THREE.DirectionalLight('#BFD0FF', .55); fill.position.set(-3.5, 2, 2.5); s.add(fill);
  const rim = new THREE.DirectionalLight('#FFFFFF', 1.4); rim.position.set(-1.5, 3.5, -4); s.add(rim);
  const piso = new THREE.Mesh(new THREE.CircleGeometry(2.2, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#2A3458', roughness: .9 })); piso.receiveShadow = true; s.add(piso); return s; }
function vista(obj, ang, cam, vx, vy, vw, vh) { const s = escena(); s.add(obj); obj.rotation.y = ang; const y = H - (vy + vh); R.setViewport(vx, y, vw, vh); R.setScissor(vx, y, vw, vh); R.render(s, cam); X.drawImage(gl, vx, vy, vw, vh, vx, vy, vw, vh); s.remove(obj); }
const L = [
  ['prota', '1 · Protagonista', ['lado', 'feliz', 'guino', 'sorpresa', 'recta', 'triste']],
  ['linda', '2 · Linda (la vecina)', ['feliz', 'sonrisa', 'preocupado']],
  ['abuela', '3 · La abuela', ['feliz', 'sonrisa']],
  ['nino_gorro', '4 · El niño del gorro', ['feliz', 'seria']],
  ['kevin', '5 · Kevin', ['lado', 'seria']],
  ['rubio', '6 · El niño rubio', ['sorpresa', 'feliz']],
  ['invitados', '7 · Invitados', ['feliz', 'preocupado']],
  ['alcalde', '8 · El alcalde', ['lado', 'feliz']],
  ['pecera', '9 · El pez del alcalde', []],
];
const crear = (k) => { if (k === 'invitados') { const g = new THREE.Group(); ['invitado_verde', 'invitado_blanco', 'invitada_amarilla'].forEach((n, j) => { const a = P.crear(n); a.position.set((j - 1) * .78, 0, -Math.abs(j - 1) * .2); g.add(a); }); g.cara = e => g.children.forEach(a => a.cara(e)); return g; }
  const g = P.crear(k); if (k === 'prota') { const b = P.balon(.17); b.position.set(.62, .62, .22); g.add(b); } return g; };
L.forEach(([k, nom, exprs], i) => {
  const cx = (i % COLS) * CW, cy = Math.floor(i / COLS) * CH;
  X.fillStyle = '#FFFFFF'; X.font = 'bold 42px "DejaVu Sans", sans-serif'; X.fillText(nom, cx + 30, cy + 56);
  const alto = k === 'pecera' ? 1.6 : 2.2, ty = alto * .5, dist = k === 'invitados' ? 6.2 : k === 'pecera' ? 3.6 : 5.0;
  [['frente', 0], ['perfil', Math.PI / 2], ['3/4', Math.PI / 4]].forEach(([nv, ang], j) => {
    const cam = new THREE.PerspectiveCamera(28, 320 / 600, .05, 60); cam.position.set(0, ty + .2, dist); cam.lookAt(0, ty, 0);
    vista(crear(k), ang, cam, cx + 15 + j * 325, cy + 80, 320, 600); X.fillStyle = '#AEB6D8'; X.font = '22px "DejaVu Sans", sans-serif'; X.fillText(nv, cx + 25 + j * 325, cy + 670);
  });
  // cabezas con cada expresión (3D)
  const cabY = k === 'alcalde' ? 3.3 * E : (3.1 + .475 * 1.25) * E, n = Math.max(1, exprs.length), hw = Math.min(160, 960 / n);
  if (k === 'pecera') { const cam = new THREE.PerspectiveCamera(30, 960 / 300, .05, 20); cam.position.set(.15, 1.18, .95); cam.lookAt(0, 1.13, 0); vista(crear(k), .3, cam, cx + 20, cy + 690, 960, 300); X.fillStyle = '#AEB6D8'; X.font = '22px "DejaVu Sans", sans-serif'; X.fillText('acercamiento', cx + 28, cy + 980); }
  exprs.forEach((e, j) => { const o = crear(k); o.cara(e); const tgt = k === 'invitados' ? new THREE.Vector3(0, cabY, 0) : new THREE.Vector3(0, cabY + .03, 0);
    const cam = new THREE.PerspectiveCamera(30, hw / 230, .05, 20); cam.position.set(tgt.x, tgt.y + .06, tgt.z + (k === 'invitados' ? 1.5 : k === 'alcalde' ? 1.2 : 1.4)); cam.lookAt(tgt);
    if (k === 'invitados') o.children.forEach((a, q) => { if (q !== 1) a.visible = false; });
    vista(o, 0, cam, cx + 20 + j * (hw + 4), cy + 690, hw, 230); X.fillStyle = '#AEB6D8'; X.font = '20px "DejaVu Sans", sans-serif'; X.fillText(e, cx + 26 + j * (hw + 4), cy + 944); });
  // tirita de colores
  (P.PALETAS[k] || []).forEach((col, j) => { const x0 = cx + 20 + j * 136, y0 = cy + 1000; X.fillStyle = col; X.fillRect(x0, y0, 40, 40); X.strokeStyle = '#000'; X.strokeRect(x0, y0, 40, 40); X.fillStyle = '#DDE2F4'; X.font = '20px "DejaVu Sans Mono", monospace'; X.fillText(col.toUpperCase(), x0 + 46, y0 + 28); });
});
window.__png = out.toDataURL('image/png'); window.__listo = true;
</script></body></html>
