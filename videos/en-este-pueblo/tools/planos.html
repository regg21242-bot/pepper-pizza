<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:Fredoka;font-weight:700;src:url(../assets/fonts/fredoka-700.woff2) format('woff2')} @font-face{font-family:'Bebas Neue';src:url(../assets/fonts/bebas-neue.woff2) format('woff2')} html,body{margin:0;background:#000}</style>
<script src="../assets/lib/three.min.js"></script>
<script src="../assets/lib/personajes.js"></script>
<script src="../assets/lib/post.js"></script>
<script src="../assets/lib/escenarios.js"></script>
<script src="../assets/lib/planos.js"></script>
</head><body>
<canvas id="gl"></canvas>
<script>
// Fotograma de un plano del guion con su subtítulo: tools/planos.html#1
const E = window.PUEBLO_E, P = window.PUEBLO_P, V3 = (...a) => new THREE.Vector3(...a);
const PLANOS = window.PLANOS;
const n = location.hash.slice(1), D = PLANOS[n];
const W = 1080, H = 1920, gl = document.getElementById('gl'); gl.width = W; gl.height = H;
const R = new THREE.WebGLRenderer({ canvas: gl, antialias: false, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.setSize(W, H, false);
R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.LinearToneMapping; R.toneMappingExposure = .85; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
(async () => { try { await document.fonts.load('700 90px Fredoka'); await document.fonts.load('100px "Bebas Neue"');
  const e = E.crear(D.esc, D.o); e.anima(D.t); if (D.extra) D.extra(e); const cam = D.cam ? E.camara(...D.cam) : e.cam;
  window.POST(R, W, H).render(e.scene, cam, Object.assign({ grano: 1 }, e.post, { focus: D.foco || e.post.focus, ap: D.ap != null ? D.ap : e.post.ap }));
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.drawImage(gl, 0, 0);
  // subtítulo: una palabra, centrada, Fredoka Bold 90 px, blanco, contorno negro 4 px, sombra suave
  if (D.sub) {
  x.font = '700 90px Fredoka'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  x.save(); x.shadowColor = 'rgba(0,0,0,.7)'; x.shadowOffsetY = 4; x.shadowBlur = 6; x.lineWidth = 8; x.strokeStyle = '#000'; x.strokeText(D.sub, W / 2, H / 2); x.restore();
  x.lineWidth = 8; x.strokeStyle = '#000'; x.strokeText(D.sub, W / 2, H / 2); x.fillStyle = '#FFF'; x.fillText(D.sub, W / 2, H / 2); }
  window.__png = c.toDataURL('image/png'); } catch (err) { console.error(err.stack); window.__png = ''; } window.__listo = true; })();
</script></body></html>
