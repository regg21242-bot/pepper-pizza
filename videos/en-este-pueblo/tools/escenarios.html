<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}</style>
<script src="../assets/lib/three.min.js"></script>
<script src="../assets/lib/personajes.js"></script>
<script src="../assets/lib/post.js"></script>
<script src="../assets/lib/escenarios.js"></script>
</head><body>
<canvas id="gl"></canvas>
<script>
// Fotograma de prueba de un escenario: tools/escenarios.html#pueblo  (opcional: #pueblo@1.5 = tiempo)
const [k, tt] = location.hash.slice(1).split('@'), t = +(tt || 1.2);
const W = 1080, H = 1920, gl = document.getElementById('gl'); gl.width = W; gl.height = H;
const R = new THREE.WebGLRenderer({ canvas: gl, antialias: false, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.setSize(W, H, false);
R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.LinearToneMapping; R.toneMappingExposure = .85; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
try { const E = window.PUEBLO_E.crear(k); E.anima(t); const PP = window.POST(R, W, H); PP.render(E.scene, E.cam, Object.assign({ grano: 1 }, E.post));
  window.__png = gl.toDataURL('image/png'); } catch (e) { console.error(e.stack); window.__png = ''; }
window.__listo = true;
</script></body></html>
