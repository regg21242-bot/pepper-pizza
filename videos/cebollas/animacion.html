<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Por qué las cebollas nos hacen llorar</title>
<style>
  html,body{margin:0;background:#000}
  canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ============================================================
   ¿Por qué las cebollas nos hacen llorar?  —  TikTok 1080x1920
   Todo se dibuja con canvas; draw(t) pinta el fotograma del segundo t.
   Abre este archivo en el navegador para ver la animación en vivo.
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920;
const FONT = 'Inter, "Inter Display", Arial, sans-serif';

/* ---------- utilidades ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeBack = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- escenas ---------- */
const SCENES = [
  { name: 'gancho',    start: 0,    end: 5,    draw: scene1 },
  { name: 'corte',     start: 5,    end: 11.5, draw: scene2 },
  { name: 'celulas',   start: 11.5, end: 20,   draw: scene3 },
  { name: 'gas',       start: 20,   end: 27,   draw: scene4 },
  { name: 'ojo',       start: 27,   end: 34.5, draw: scene5 },
  { name: 'trucos',    start: 34.5, end: 41,   draw: scene6 },
  { name: 'final',     start: 41,   end: 44.5, draw: scene7 },
];
const DURATION = 44.5;
const TRANS = 0.5;

/* ---------- textura de grano (detalle tipo papel) ---------- */
const grain = document.createElement('canvas');
grain.width = 540; grain.height = 960;
(() => {
  const g = grain.getContext('2d');
  const img = g.createImageData(540, 960);
  const r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 128 + (r() - .5) * 120;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
})();

function background(c1, c2, t, opts = {}) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // resplandor suave
  const rg = ctx.createRadialGradient(W / 2, H * .45, 50, W / 2, H * .45, 1000);
  rg.addColorStop(0, opts.glow || 'rgba(255,255,255,0.16)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  // partículas bokeh
  if (opts.bokeh !== false) {
    const r = rng(opts.seed || 3);
    for (let i = 0; i < 26; i++) {
      const bx = r() * W, by = r() * H, br = 8 + r() * 34, sp = 10 + r() * 30;
      const y = ((by - t * sp) % H + H) % H;
      const x = bx + Math.sin(t * .6 + i) * 20;
      ctx.fillStyle = `rgba(255,255,255,${0.03 + r() * 0.06})`;
      ctx.beginPath(); ctx.arc(x, y, br, 0, 7); ctx.fill();
    }
  }
}
function finishFrame() {
  // grano
  ctx.save(); ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain, 0, 0, W, H); ctx.restore();
  // viñeta
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ---------- texto estilo TikTok ---------- */
function parseWords(text) {
  // *palabra* = resaltada
  return text.split(' ').map(w => {
    const hl = w.includes('*');
    return { w: w.replace(/\*/g, ''), hl };
  });
}
function caption(text, cx, cy, t, t0, opts = {}) {
  if (t < t0) return;
  const size = opts.size || 74;
  const maxW = opts.maxW || 900;
  const hlColor = opts.hl || '#FFD23F';
  const color = opts.color || '#FFFFFF';
  const fade = opts.tOut !== undefined ? 1 - prog(t, opts.tOut, opts.tOut + .3) : 1;
  if (fade <= 0) return;
  ctx.save();
  ctx.font = `900 ${size}px ${FONT}`;
  ctx.textBaseline = 'middle';
  const words = parseWords(text);
  const space = ctx.measureText(' ').width;
  const lines = []; let cur = []; let curW = 0;
  for (const wd of words) {
    wd.width = ctx.measureText(wd.w).width;
    if (cur.length && curW + space + wd.width > maxW) { lines.push({ words: cur, width: curW }); cur = []; curW = 0; }
    curW += (cur.length ? space : 0) + wd.width; cur.push(wd);
  }
  if (cur.length) lines.push({ words: cur, width: curW });
  const lh = size * 1.18;
  let y = cy - (lines.length - 1) * lh / 2;
  let idx = 0;
  for (const ln of lines) {
    let x = cx - ln.width / 2;
    for (const wd of ln.words) {
      const p = prog(t, t0 + idx * 0.07, t0 + idx * 0.07 + 0.28);
      if (p > 0) {
        const s = easeBack(p);
        const wx = x + wd.width / 2;
        ctx.save();
        ctx.globalAlpha = fade * clamp(p * 3);
        ctx.translate(wx, y); ctx.scale(s, s);
        if (opts.tilt) ctx.rotate((idx % 2 ? 1 : -1) * 0.02);
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
        ctx.strokeStyle = '#111'; ctx.lineWidth = size * 0.24;
        ctx.strokeText(wd.w, -wd.width / 2, 0);
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = wd.hl ? hlColor : color;
        ctx.fillText(wd.w, -wd.width / 2, 0);
        ctx.restore();
      }
      x += wd.width + space; idx++;
    }
    y += lh;
  }
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function pill(text, cx, cy, t, t0, opts = {}) {
  if (t < t0) return;
  const p = easeBack(prog(t, t0, t0 + .35));
  const fade = opts.tOut !== undefined ? 1 - prog(t, opts.tOut, opts.tOut + .3) : 1;
  if (fade <= 0) return;
  const size = opts.size || 42;
  ctx.save();
  ctx.font = `800 ${size}px ${FONT}`;
  const tw = ctx.measureText(text).width;
  const pw = tw + size * 1.1, ph = size * 1.65;
  ctx.globalAlpha = fade * clamp(p * 2);
  ctx.translate(cx, cy); ctx.scale(p, p);
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
  roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2);
  ctx.fillStyle = opts.bg || '#FFFFFF'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 5; ctx.strokeStyle = opts.border || 'rgba(0,0,0,0.85)'; ctx.stroke();
  ctx.fillStyle = opts.fg || '#111'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillText(text, 0, 3);
  ctx.restore();
}
function arrowLine(x1, y1, x2, y2, p, color = '#fff', wdt = 6) {
  if (p <= 0) return;
  const x = lerp(x1, x2, p), y = lerp(y1, y2, p);
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = wdt; ctx.lineCap = 'round';
  ctx.setLineDash([2, 16]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, wdt * 1.4, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- gotas ---------- */
function drop(x, y, r, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(x, y - r * 2.3);
  ctx.bezierCurveTo(x + r * .3, y - r * 1.5, x + r, y - r * .8, x + r, y);
  ctx.arc(x, y, r, 0, Math.PI);
  ctx.bezierCurveTo(x - r, y - r * .8, x - r * .3, y - r * 1.5, x, y - r * 2.3);
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r * 1.6);
  g.addColorStop(0, '#E8F8FF'); g.addColorStop(.5, '#7FD3FF'); g.addColorStop(1, '#2F8FE0');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = r * .12; ctx.strokeStyle = 'rgba(20,70,140,0.6)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .35, r * .18, r * .3, -.5, 0, 7); ctx.fill();
  ctx.restore();
}

/* ============================================================
   CEBOLLA detallada
   ============================================================ */
function onionBodyPath() {
  ctx.beginPath();
  ctx.moveTo(0, -1.3);
  ctx.bezierCurveTo(0.07, -1.0, 0.25, -0.82, 0.55, -0.58);
  ctx.bezierCurveTo(1.08, -0.18, 1.06, 0.58, 0.56, 0.86);
  ctx.bezierCurveTo(0.3, 1.0, -0.3, 1.0, -0.56, 0.86);
  ctx.bezierCurveTo(-1.06, 0.58, -1.08, -0.18, -0.55, -0.58);
  ctx.bezierCurveTo(-0.25, -0.82, -0.07, -1.0, 0, -1.3);
  ctx.closePath();
}
function drawOnion(x, y, s, o = {}) {
  const t = o.t || 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(o.rot || 0);
  ctx.scale(s * (o.sx || 1), s * (o.sy || 1));
  const lw = 1 / s;

  // sombra en el suelo
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(0.05, 1.02, 0.78, 0.11, 0, 0, 7); ctx.fill();
  ctx.restore();

  // raíces
  const rr = rng(11);
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 0; i < 16; i++) {
    const a = -0.9 + 1.8 * (i / 15) + (rr() - .5) * .2;
    const len = 0.18 + rr() * 0.22;
    const sx = Math.sin(a) * 0.12, sy = 0.93;
    const ex = sx + Math.sin(a) * len * 1.4, ey = sy + Math.cos(a * .6) * len;
    const wig = Math.sin(t * 2 + i) * 0.02;
    ctx.strokeStyle = '#8E7454'; ctx.lineWidth = 9 * lw;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo((sx + ex) / 2 + wig + (rr() - .5) * .1, (sy + ey) / 2, ex, ey); ctx.stroke();
    ctx.strokeStyle = '#EADBBE'; ctx.lineWidth = 5 * lw;
    ctx.stroke();
  }
  ctx.restore();
  // placa basal
  ctx.fillStyle = '#C9AE84';
  ctx.beginPath(); ctx.ellipse(0, 0.93, 0.17, 0.06, 0, 0, 7); ctx.fill();

  // cuello seco / punta
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-0.06, -1.15);
  ctx.bezierCurveTo(-0.07, -1.38, 0.0, -1.5, 0.12 + Math.sin(t * 1.5) * .02, -1.62);
  ctx.bezierCurveTo(0.08, -1.48, 0.07, -1.35, 0.07, -1.15);
  ctx.closePath();
  const ng = ctx.createLinearGradient(-0.1, 0, 0.1, 0);
  ng.addColorStop(0, '#9A5A26'); ng.addColorStop(.5, '#D9A062'); ng.addColorStop(1, '#8A4E1E');
  ctx.fillStyle = ng; ctx.fill();
  ctx.lineWidth = 5 * lw; ctx.strokeStyle = '#5A2E10'; ctx.stroke();
  ctx.restore();

  // cuerpo
  onionBodyPath();
  const bg = ctx.createRadialGradient(-0.3, -0.25, 0.05, 0, 0.1, 1.15);
  if (o.red) {
    bg.addColorStop(0, '#F3B6D6'); bg.addColorStop(.4, '#B24A86'); bg.addColorStop(.8, '#6E1F52'); bg.addColorStop(1, '#3E0C2C');
  } else {
    bg.addColorStop(0, '#FBE3B0'); bg.addColorStop(.38, '#E9A85E'); bg.addColorStop(.75, '#BC6A2B'); bg.addColorStop(1, '#7A3C14');
  }
  ctx.fillStyle = bg; ctx.fill();

  // vetas
  ctx.save();
  onionBodyPath(); ctx.clip();
  for (let i = -7; i <= 7; i++) {
    const k = i / 7;
    ctx.beginPath();
    ctx.moveTo(k * 0.04, -1.25);
    ctx.bezierCurveTo(k * 1.15, -0.5, k * 1.08, 0.5, k * 0.18, 0.95);
    ctx.lineWidth = (i % 2 ? 5 : 9) * lw;
    ctx.strokeStyle = i % 2 ? 'rgba(255,230,180,0.28)' : 'rgba(110,50,15,0.33)';
    ctx.stroke();
  }
  // capa de piel papel que se despega
  ctx.beginPath();
  ctx.moveTo(0.35, -0.55); ctx.bezierCurveTo(0.7, -0.35, 0.82, 0.05, 0.78, 0.3);
  ctx.bezierCurveTo(0.68, 0.18, 0.55, 0.0, 0.42, -0.2); ctx.closePath();
  ctx.fillStyle = 'rgba(250,215,160,0.35)'; ctx.fill();
  // sombra inferior
  const sh = ctx.createLinearGradient(0, 0.2, 0, 1);
  sh.addColorStop(0, 'rgba(60,20,0,0)'); sh.addColorStop(1, 'rgba(60,20,0,0.35)');
  ctx.fillStyle = sh; ctx.fillRect(-1.2, -1.4, 2.4, 2.5);
  ctx.restore();

  // brillo
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.beginPath(); ctx.ellipse(-0.42, -0.12, 0.09, 0.3, 0.32, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-0.33, -0.48, 0.05, 0.07, 0.4, 0, 7); ctx.fill();
  ctx.restore();

  // contorno
  onionBodyPath();
  ctx.lineWidth = 9 * lw; ctx.strokeStyle = o.red ? '#2A0820' : '#4A2208'; ctx.stroke();

  if (o.face) drawOnionFace(o);
  ctx.restore();
}
function drawOnionFace(o) {
  const t = o.t || 0;
  const mood = o.mood || 'cry';
  const lw = 1 / (o.scale || 300);
  // mejillas
  ctx.fillStyle = 'rgba(255,110,110,0.35)';
  ctx.beginPath(); ctx.ellipse(-0.45, 0.33, 0.13, 0.07, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.45, 0.33, 0.13, 0.07, 0, 0, 7); ctx.fill();
  const blink = (Math.sin(t * 1.3) > 0.985) ? 0.15 : 1;
  for (const sx of [-1, 1]) {
    const ex = 0.27 * sx, ey = 0.08;
    // ojo
    ctx.save();
    ctx.beginPath(); ctx.ellipse(ex, ey, 0.13, 0.16 * blink, 0, 0, 7);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.lineWidth = 0.025; ctx.strokeStyle = '#3A1A06'; ctx.stroke();
    if (blink > .5) {
      ctx.fillStyle = '#2B1608';
      ctx.beginPath(); ctx.ellipse(ex + 0.01 * sx, ey + 0.03, 0.08, 0.1, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex - 0.025, ey - 0.01, 0.03, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + 0.03, ey + 0.06, 0.014, 0, 7); ctx.fill();
    }
    ctx.restore();
    // cejas
    ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 0.035; ctx.strokeStyle = '#3A1A06';
    ctx.beginPath();
    if (mood === 'happy') { ctx.moveTo(ex - 0.1, ey - 0.25); ctx.quadraticCurveTo(ex, ey - 0.31, ex + 0.1, ey - 0.25); }
    else { ctx.moveTo(ex - 0.11 * sx, ey - 0.2); ctx.lineTo(ex + 0.1 * sx, ey - 0.28); }
    ctx.stroke(); ctx.restore();
  }
  // boca
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (mood === 'happy') {
    ctx.beginPath(); ctx.moveTo(-0.16, 0.38); ctx.quadraticCurveTo(0, 0.6, 0.16, 0.38); ctx.closePath();
    ctx.fillStyle = '#5A1A10'; ctx.fill(); ctx.lineWidth = 0.025; ctx.strokeStyle = '#3A1A06'; ctx.stroke();
    ctx.fillStyle = '#FF7A7A'; ctx.beginPath(); ctx.ellipse(0, 0.5, 0.07, 0.035, 0, 0, 7); ctx.fill();
  } else if (mood === 'worried') {
    ctx.beginPath(); ctx.ellipse(0, 0.45, 0.07, 0.05 + Math.sin(t * 6) * .01, 0, 0, 7);
    ctx.fillStyle = '#5A1A10'; ctx.fill(); ctx.lineWidth = 0.025; ctx.strokeStyle = '#3A1A06'; ctx.stroke();
  } else {
    const wob = Math.sin(t * 14) * 0.015;
    ctx.beginPath(); ctx.moveTo(-0.17, 0.5 + wob);
    ctx.bezierCurveTo(-0.08, 0.36, 0.08, 0.36, 0.17, 0.5 - wob);
    ctx.bezierCurveTo(0.08, 0.44, -0.08, 0.44, -0.17, 0.5 + wob);
    ctx.fillStyle = '#5A1A10'; ctx.fill(); ctx.lineWidth = 0.025; ctx.strokeStyle = '#3A1A06'; ctx.stroke();
  }
  ctx.restore();
  // lágrimas
  if (o.tears) {
    for (const sx of [-1, 1]) {
      const ex = 0.3 * sx, ey = 0.2;
      // río de lágrima
      ctx.save();
      ctx.globalAlpha = 0.55 * o.tears;
      ctx.strokeStyle = '#8FDcff'; ctx.lineWidth = 0.05; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex, ey); ctx.quadraticCurveTo(ex + 0.06 * sx, ey + 0.25, ex + 0.04 * sx, ey + 0.45); ctx.stroke();
      ctx.restore();
      for (let k = 0; k < 3; k++) {
        const ph = ((t * 0.9 + k / 3 + (sx > 0 ? .17 : 0)) % 1);
        const dx = ex + 0.06 * sx + sx * ph * 0.25;
        const dy = ey + 0.1 + ph * ph * 1.4;
        drop(dx, dy, 0.045, o.tears * (1 - ph * .6));
      }
    }
  }
}
/* rodaja de cebolla (aros concéntricos) */
function drawSlice(x, y, r, rot = 0, tilt = .82) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, tilt);
  // grosor
  ctx.fillStyle = '#D8C49A';
  ctx.beginPath(); ctx.arc(0, r * .12, r, 0, 7); ctx.fill();
  // piel exterior
  ctx.fillStyle = '#B5682C'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  const n = 7;
  for (let i = 0; i < n; i++) {
    const rr = r * (0.93 - i * 0.125);
    if (rr <= 0) break;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7);
    const g = ctx.createRadialGradient(-rr * .3, -rr * .3, 0, 0, 0, rr);
    g.addColorStop(0, i % 2 ? '#FFF8E6' : '#FBF0D2');
    g.addColorStop(1, i % 2 ? '#EBDDB4' : '#E2CD98');
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = Math.max(1.5, r * .018); ctx.strokeStyle = 'rgba(170,130,70,0.75)'; ctx.stroke();
  }
  ctx.fillStyle = '#F4E6C0'; ctx.beginPath(); ctx.arc(0, 0, r * .06, 0, 7); ctx.fill();
  // brillo húmedo
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.ellipse(-r * .38, -r * .42, r * .16, r * .06, -.6, 0, 7); ctx.fill();
  ctx.lineWidth = Math.max(3, r * .03); ctx.strokeStyle = '#4A2208';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.restore();
}

/* ---------- cuchillo detallado ---------- */
function drawKnife(x, y, ang, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  // sombra
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 18;
  // hoja: filo en y=0, lomo arriba (y=-140), punta a la izquierda
  ctx.beginPath();
  ctx.moveTo(-430, -10);
  ctx.quadraticCurveTo(-300, 4, 0, 2);
  ctx.lineTo(70, 0); ctx.lineTo(70, -140); ctx.lineTo(-120, -138);
  ctx.quadraticCurveTo(-330, -120, -430, -10);
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, -140, 0, 4);
  bg.addColorStop(0, '#7E8B96'); bg.addColorStop(.35, '#D6DEE5'); bg.addColorStop(.7, '#F4F8FB'); bg.addColorStop(1, '#AFBAC4');
  ctx.fillStyle = bg; ctx.fill();
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = '#3B4650'; ctx.stroke();
  // bisel del filo
  ctx.beginPath(); ctx.moveTo(-400, -16); ctx.quadraticCurveTo(-290, -18, 0, -22); ctx.lineTo(68, -22);
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(80,95,110,0.6)'; ctx.stroke();
  // reflejo
  ctx.beginPath(); ctx.moveTo(-300, -95); ctx.lineTo(20, -110);
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineCap = 'round'; ctx.stroke();
  // grabado

  ctx.lineTo(420, -40); ctx.quadraticCurveTo(420, -6, 380, -8); ctx.lineTo(98, -2); ctx.closePath();
  const hg = ctx.createLinearGradient(0, -140, 0, 0);

  // veta de la madera

/* ============================================================
   ESCENA 2 — El corte
   ============================================================ */
const CHOPS = [1.0, 1.75, 2.5, 3.25]; // inicio de cada golpe (local)
const CHOP_X = [700, 640, 580, 520];
function scene2(t) {
  // pared de azulejos
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#F4E9D8'); g.addColorStop(1, '#E5CFAE');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(160,130,95,0.25)'; ctx.lineWidth = 4;
  for (let y = 0; y < 1000; y += 135) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let r = 0; r * 135 < 1000; r++) for (let x = (r % 2) * 67; x < W; x += 135) { ctx.beginPath(); ctx.moveTo(x, r * 135); ctx.lineTo(x, r * 135 + 135); ctx.stroke(); }
  // encimera
  ctx.fillStyle = '#8D6E55'; ctx.fillRect(0, 990, W, H - 990);
  ctx.fillStyle = '#6E523E'; ctx.fillRect(0, 990, W, 22);
  // tabla de cortar
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
  roundRect(70, 1120, 940, 430, 40);
  const bg = ctx.createLinearGradient(0, 1120, 0, 1550);
  bg.addColorStop(0, '#E9B97C'); bg.addColorStop(1, '#C98D50');
  ctx.fillStyle = bg; ctx.fill();
  ctx.restore();
  ctx.save(); roundRect(70, 1120, 940, 430, 40); ctx.clip();
  const r = rng(21);
  ctx.strokeStyle = 'rgba(140,85,40,0.35)'; ctx.lineWidth = 3;
  for (let i = 0; i < 18; i++) {
    const yy = 1130 + i * 24 + r() * 10;
    ctx.beginPath(); ctx.moveTo(60, yy);
    ctx.bezierCurveTo(300, yy + (r() - .5) * 30, 700, yy + (r() - .5) * 30, 1020, yy + (r() - .5) * 10); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(70, 1120, 940, 30);
  ctx.restore();
  ctx.lineWidth = 6; ctx.strokeStyle = '#7A4A22'; roundRect(70, 1120, 940, 430, 40); ctx.stroke();

  // rodajas que salen volando
  let chopsDone = 0;
  for (let i = 0; i < CHOPS.length; i++) {
    const imp = CHOPS[i] + 0.25;
    if (t > imp) chopsDone++;
  }
  // cebolla
  const shake = (() => { let s = 0; for (const c of CHOPS) { const d = t - (c + .25); if (d > 0 && d < .2) s += Math.sin(d * 90) * (1 - d / .2) * 6; } return s; })();
  drawOnion(560 + shake, 1240, 230, { t, face: true, mood: t > 1 ? 'worried' : 'worried', rot: -0.05, scale: 230 });
  // líneas de corte en la cebolla
  for (let i = 0; i < chopsDone; i++) {
    ctx.save(); ctx.strokeStyle = 'rgba(255,248,225,0.9)'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(CHOP_X[i] + shake, 1240 - 200); ctx.lineTo(CHOP_X[i] + shake, 1240 + 205); ctx.stroke();
    ctx.strokeStyle = 'rgba(90,40,10,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(CHOP_X[i] + 5 + shake, 1240 - 200); ctx.lineTo(CHOP_X[i] + 5 + shake, 1240 + 205); ctx.stroke();
    ctx.restore();
  }
  // rodajas volando
  for (let i = 0; i < chopsDone; i++) {
    const d = t - (CHOPS[i] + .25);
    const p = easeOut(clamp(d / 0.9));
    const tx = [260, 820, 220, 860][i], ty = [760, 720, 960, 940][i];
    const sx = CHOP_X[i], sy = 1240;
    const x = lerp(sx, tx, p), y = lerp(sy, ty, p) - Math.sin(p * Math.PI) * 220;
    drawSlice(x, y, 95 * (0.4 + 0.6 * p), d * 2 + i, .85);
  }
  // salpicaduras de jugo + vapor
  for (let i = 0; i < CHOPS.length; i++) {
    const d = t - (CHOPS[i] + .25);
    if (d < 0) continue;
    const rr = rng(100 + i);
    if (d < 0.8) {
      for (let k = 0; k < 18; k++) {
        const a = -Math.PI / 2 + (rr() - .5) * 2.4, sp = 300 + rr() * 500;
        const px = CHOP_X[i] + Math.cos(a) * sp * d, py = 1080 + Math.sin(a) * sp * d + 900 * d * d;
        ctx.fillStyle = `rgba(230,250,200,${0.85 * (1 - d / .8)})`;
        ctx.beginPath(); ctx.arc(px, py, 5 + rr() * 7, 0, 7); ctx.fill();
      }
    }
    // vapor (anticipa el gas)
    for (let k = 0; k < 5; k++) {
      const ph = (d * 0.35 + k * .2) % 1;
      if (d * 0.35 < k * .2 * 0) continue;
      const px = CHOP_X[i] + Math.sin(d * 2 + k) * 40, py = 1050 - ph * 520;
      ctx.fillStyle = `rgba(190,240,170,${0.18 * Math.sin(ph * Math.PI)})`;
      ctx.beginPath(); ctx.arc(px, py, 40 + ph * 70, 0, 7); ctx.fill();
    }
  }
  // cuchillo
  let ky = 640, kx = 760;
  for (let i = 0; i < CHOPS.length; i++) {
    const d = t - CHOPS[i];
    if (d >= -0.4 && d < 0.75) {
      kx = CHOP_X[i] + 210;
      if (d < 0) ky = 640;
      else if (d < .25) ky = lerp(640, 1460, easeIn(d / .25));
      else if (d < .4) ky = 1460;
      else ky = lerp(1460, 640, easeOut((d - .4) / .35));
      break;
    }
    if (d >= 0.75) { kx = (CHOP_X[i + 1] || CHOP_X[i]) + 210; }
  }
  const kin = easeOut(prog(t, 0.3, 0.9));
  const kout = easeIn(prog(t, 4.6, 5.3));
  // cuchillo vertical: filo hacia abajo
  drawKnife(kx + (1 - kin) * 700 + kout * 800, ky - kout * 300, Math.PI / 2 - 0.05, 0.95);
  // destello de impacto
  for (const c of CHOPS) {
    const d = t - (c + .25);
    if (d > 0 && d < .25) {
      ctx.save(); ctx.globalAlpha = 1 - d / .25; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      const cx = CHOP_X[CHOPS.indexOf(c)];
      for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 60, 1050 + Math.sin(a) * 60); ctx.lineTo(cx + Math.cos(a) * (90 + d * 300), 1050 + Math.sin(a) * (90 + d * 300)); ctx.stroke(); }
      ctx.restore();
    }
  }
  caption('Todo empieza al *cortarla*', 540, 300, t, 0.2, { size: 80, tOut: 3.4 });
  caption('Cada corte rompe *miles de células*', 540, 300, t, 3.7, { size: 78 });
}

/* ============================================================
   ESCENA 3 — Dentro de las células
   ============================================================ */
const CELL_W = 260, CELL_H = 110;
const SULF = [[-95, -18], [-70, 14], [-48, -26], [-30, 8], [-12, -20], [-88, 30], [-52, 34], [-20, 32]];
const ENZ = [[40, -30], [78, 8], [110, -32], [52, 30], [104, 34]];
function drawCell(cx, cy, w, h, seed, detail, broken = 0, t = 0) {
  const r = rng(seed);
  ctx.save(); ctx.translate(cx, cy);
  // pared celular (doble)
  roundRect(-w / 2, -h / 2, w, h, 16);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, '#F9F1D2'); g.addColorStop(1, '#EADBAA');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 7; ctx.strokeStyle = '#B9A060'; ctx.stroke();
  roundRect(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 12);
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(150,120,50,0.5)'; ctx.stroke();
  // citoplasma granulado
  ctx.fillStyle = 'rgba(160,140,70,0.25)';
  for (let i = 0; i < 25; i++) { ctx.beginPath(); ctx.arc((r() - .5) * (w - 24), (r() - .5) * (h - 24), 1.5 + r() * 2, 0, 7); ctx.fill(); }
  // núcleo
  const nx = (r() - .5) * w * .6, ny = (r() - .5) * h * .4;
  ctx.fillStyle = '#C79BD6'; ctx.beginPath(); ctx.ellipse(nx, ny, 17, 13, r(), 0, 7); ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#8A5A9E'; ctx.stroke();
  ctx.fillStyle = '#7A4590'; ctx.beginPath(); ctx.arc(nx + 3, ny - 2, 5, 0, 7); ctx.fill();
  ctx.restore();
}
function sulfoxide(x, y, r, color = '#F5C518') {
  // molécula: azufre amarillo + oxígeno rojo + cadena gris
  ctx.save(); ctx.translate(x, y);
  ctx.strokeStyle = '#444'; ctx.lineWidth = r * .35;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 1.2, -r * .8); ctx.moveTo(0, 0); ctx.lineTo(-r * 1.3, r * .4); ctx.stroke();
  sphere(r * 1.2, -r * .8, r * .55, '#E8433A');
  sphere(-r * 1.3, r * .4, r * .6, '#555B66');
  sphere(0, 0, r, color);
  ctx.restore();
}
function sphere(x, y, r, col) {
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  g.addColorStop(0, '#FFFFFF'); g.addColorStop(.25, col); g.addColorStop(1, shade(col, -0.55));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.lineWidth = Math.max(1, r * .1); ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.stroke();
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * (1 + k)); g = Math.round(g * (1 + k)); b = Math.round(b * (1 + k));
  return `rgb(${clamp(r, 0, 255)},${clamp(g, 0, 255)},${clamp(b, 0, 255)})`;
}
function enzyme(x, y, r, ang, chomp, col = '#8E5BD6') {
  // forma de "pac-man" con textura de proteína plegada
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  const m = 0.35 + chomp * 0.35;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, m, Math.PI * 2 - m); ctx.closePath();
  const g = ctx.createRadialGradient(-r * .3, -r * .4, r * .1, 0, 0, r);
  g.addColorStop(0, shade(col, 0.6)); g.addColorStop(.5, col); g.addColorStop(1, shade(col, -0.45));
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = r * .1; ctx.strokeStyle = shade(col, -0.65); ctx.stroke();
  // plegamientos
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = r * .08;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-r * .3, r * (.0 + i * .1), r * (0.3 + i * .18), 3.6, 5.6); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-r * .1, -r * .5, r * .16, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-r * .06, -r * .5, r * .08, 0, 7); ctx.fill();
  ctx.restore();
}
function scene3(t) {
  background('#0B2B2E', '#0F3E36', t, { seed: 9, glow: 'rgba(120,255,200,0.12)' });
  const cx = 540, cy = 960, R = 470;
  // anillo del microscopio
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 50;
  ctx.beginPath(); ctx.arc(cx, cy, R + 40, 0, 7);
  const rg = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  rg.addColorStop(0, '#E2E8EE'); rg.addColorStop(.5, '#6B7682'); rg.addColorStop(1, '#2C333A');
  ctx.fillStyle = rg; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
  ctx.fillStyle = '#DCEFD9'; ctx.fillRect(0, 0, W, H);

  // cámara: zoom a la célula central
  const z = lerp(1, 3.45, easeInOut(prog(t, 0.3, 2.2)));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(z, z); ctx.rotate(-0.12 * (1 - easeInOut(prog(t, .3, 2.2))));
  // tejido: ladrillos de células (como la epidermis real de la cebolla)
  for (let row = -6; row <= 6; row++) {
    for (let col = -4; col <= 4; col++) {
      const off = (row % 2 ? CELL_W / 2 : 0);
      const x = col * CELL_W + off, y = row * CELL_H;
      if (row === 0 && col === 0) continue;
      drawCell(x, y, CELL_W - 4, CELL_H - 4, 1000 + row * 31 + col, false);
    }
  }
  // célula central
  const tb = 4.2; // momento de ruptura
  const broken = prog(t, tb, tb + .4);
  ctx.save();
  drawCell(0, 0, CELL_W - 4, CELL_H - 4, 77, true);
  // vacuola con sulfóxidos
  const vac = 1 - prog(t, tb, tb + .6);
  if (vac > 0) {
    ctx.save(); ctx.globalAlpha = vac;
    ctx.beginPath(); ctx.ellipse(-55, 6, 66, 40, 0, 0, 7);
    ctx.fillStyle = 'rgba(170,215,255,0.55)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(70,130,200,0.8)'; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
  // moléculas
  const mix = easeInOut(prog(t, tb + .2, tb + 1.8));
  SULF.forEach(([sx, sy], i) => {
    const e = ENZ[i % ENZ.length];
    const jit = Math.sin(t * 3 + i) * 2;
    const x = lerp(sx, e[0] - 12, mix) + jit, y = lerp(sy, e[1] + (i > 4 ? 10 : 0), mix) + Math.cos(t * 2.6 + i) * 2;
    const done = prog(t, tb + 1.6 + i * .05, tb + 1.9 + i * .05);
    sulfoxide(x - done * 14, y - done * 6, 6.5, done > .5 ? '#5BE37D' : '#F5C518');
    if (done > 0 && done < 1) {
      ctx.save(); ctx.globalAlpha = 1 - done; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 6 + done * 26, 0, 7); ctx.stroke(); ctx.restore();
    }
  });
  ENZ.forEach(([ex, ey], i) => {
    const chomp = mix > .7 ? (Math.sin(t * 16 + i) * .5 + .5) : (Math.sin(t * 3 + i) * .5 + .5) * .3;
    enzyme(ex + Math.sin(t * 2 + i) * 2, ey + Math.cos(t * 2.2 + i) * 2, 11, Math.PI, chomp);
  });
  ctx.restore();
  // grieta en la pared
  if (broken > 0) {
    ctx.save(); ctx.strokeStyle = '#3B2A10'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath();
    const pts = [[-30, -56], [-18, -38], [-26, -22], [-10, -6], [-20, 10], [-4, 26], [-12, 56]];
    pts.forEach(([x, y], i) => { const k = i / (pts.length - 1); if (k <= broken) (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); });
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore(); // cámara

  // hoja del cuchillo atravesando
  const ks = prog(t, tb - .35, tb + .35);
  if (ks > 0 && ks < 1) {
    ctx.save();
    drawKnife(lerp(-200, 1200, ks), lerp(300, 1500, ks), 1.05, 1.6);
    ctx.restore();
  }
  if (t > tb && t < tb + .15) { ctx.fillStyle = `rgba(255,255,255,${1 - (t - tb) / .15})`; ctx.fillRect(0, 0, W, H); }
  // reflejo de lente
  const lg = ctx.createRadialGradient(cx - 200, cy - 250, 10, cx - 200, cy - 250, 380);
  lg.addColorStop(0, 'rgba(255,255,255,0.25)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  ctx.restore(); // clip
  ctx.lineWidth = 10; ctx.strokeStyle = '#1C2329'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  pill('Microscopio  ×400', 540, 420, t, 0.2, { bg: '#1C2329', fg: '#9CF5C8', border: '#9CF5C8', size: 36, tOut: 4.0 });

  // etiquetas
  pill('Compuestos de azufre', 330, 1520, t, 2.4, { bg: '#F5C518', size: 40, tOut: 5.7 });
  pill('Enzima: aliinasa', 760, 1630, t, 2.8, { bg: '#B98CFF', size: 40, tOut: 5.7 });
  arrowLine(330, 1480, 400, 1060, prog(t, 2.5, 3.0) * (1 - prog(t, 5.7, 6)), '#F5C518');
  arrowLine(760, 1590, 760, 1000, prog(t, 2.9, 3.4) * (1 - prog(t, 5.7, 6)), '#B98CFF');
  pill('= Ácido sulfénico', 540, 1560, t, 6.2, { bg: '#5BE37D', size: 48 });

  caption('Dentro, el azufre y una enzima viven *separados*', 540, 300, t, 2.2, { size: 64, tOut: 4.1 });
  caption('Al romperse, se *mezclan* y reaccionan', 540, 300, t, 4.6, { size: 68 });
}

/* ============================================================
   ESCENA 4 — El gas lacrimógeno
   ============================================================ */
const MOL = {
  atoms: [
    ['C', -2.5, -0.4, 0], ['C', -1.3, 0.45, 0], ['C', 0, -0.2, 0], ['S', 1.45, 0.5, 0], ['O', 2.75, -0.25, 0],
    ['H', -3.4, 0.2, 0.3], ['H', -2.6, -1.1, 0.9], ['H', -2.5, -1.05, -0.9],
    ['H', -1.3, 1.1, 0.9], ['H', -1.3, 1.1, -0.9], ['H', 0.0, -1.3, 0],
  ],
  bonds: [[0, 1, 1], [1, 2, 1], [2, 3, 2], [3, 4, 2], [0, 5, 1], [0, 6, 1], [0, 7, 1], [1, 8, 1], [1, 9, 1], [2, 10, 1]],
};
const ATOM = { C: ['#4A4E5A', .52], H: ['#F4F4F4', .32], S: ['#F5C518', .72], O: ['#E8433A', .58] };
function drawMolecule(cx, cy, scale, a, b) {
  const pts = MOL.atoms.map(([el, x, y, z]) => {

  ctx.restore();
  ctx.save(); ctx.strokeStyle = '#FFD23F'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (const [dx, dy] of [[30, -40], [42, -22], [12, -48]]) { ctx.beginPath(); ctx.moveTo(x + dx, y + dy); ctx.lineTo(x + dx * 1.35, y + dy * 1.35); ctx.stroke(); }
  ctx.restore();
}
function iconRoot(x, y, s) {
  drawOnion(x, y - 5, 38 * s, { t: 0, rot: Math.PI });
  ctx.save(); ctx.strokeStyle = '#E8433A'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(x, y - 42, 26, 0, 7); ctx.stroke(); ctx.restore();
}
function iconFan(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.save(); ctx.rotate(t * 8);
  for (let i = 0; i < 3; i++) {
    ctx.rotate(Math.PI * 2 / 3);
    ctx.fillStyle = '#5BB8E8'; ctx.beginPath(); ctx.ellipse(0, -24, 14, 26, .3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#1F5F86'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#1F5F86'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
  ctx.restore();
}
const TIPS = [
  { icon: iconCold, title: 'Enfríala 30 min', sub: 'El frío frena las enzimas', col: '#DDF2FF' },
  { icon: iconKnife, title: 'Cuchillo bien afilado', sub: 'Rompe menos células', col: '#FFF1C9' },
  { icon: iconRoot, title: 'Deja la raíz al final', sub: 'Concentra más compuestos', col: '#FFE0D6' },
  { icon: iconFan, title: 'Ventila o usa campana', sub: 'Aleja el gas de tus ojos', col: '#E1F7E4' },
];
function scene6(t) {
  background('#FFD86B', '#FF8F5A', t, { seed: 31, glow: 'rgba(255,255,255,0.3)' });
  // patrón de puntos
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let y = 0; y < H; y += 60) for (let x = (y / 60 % 2) * 30; x < W; x += 60) { ctx.beginPath(); ctx.arc(x + (t * 15 % 60), y, 4, 0, 7); ctx.fill(); }
  caption('Trucos para *no llorar*', 540, 330, t, 0.15, { size: 92, hl: '#FFFFFF', color: '#FFE89A' });
  TIPS.forEach((tip, i) => {
    const t0 = 0.7 + i * 1.05;
    const p = easeBack(prog(t, t0, t0 + .5));
    if (p <= 0) return;
    const cx = 60 + (1 - p) * 1100, cy = 520 + i * 245, cw = 840, ch = 210;
    ctx.save();
    ctx.shadowColor = 'rgba(120,50,0,0.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
    roundRect(cx, cy, cw, ch, 44); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.restore();
    ctx.lineWidth = 6; ctx.strokeStyle = '#2A1606'; roundRect(cx, cy, cw, ch, 44); ctx.stroke();
    // número
    ctx.fillStyle = '#2A1606'; ctx.beginPath(); ctx.arc(cx + 10, cy + 10, 34, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFD23F'; ctx.font = `900 40px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), cx + 10, cy + 12);
    // icono
    ctx.fillStyle = tip.col; ctx.beginPath(); ctx.arc(cx + 125, cy + ch / 2, 78, 0, 7); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.stroke();
    const wob = 1 + Math.sin(t * 4 + i) * .04;
    tip.icon(cx + 125, cy + ch / 2, wob, t);
    // texto
    ctx.textAlign = 'left'; ctx.fillStyle = '#1B1206';
    ctx.font = `900 50px ${FONT}`; ctx.fillText(tip.title, cx + 230, cy + 82, cw - 280);
    ctx.fillStyle = '#7A5530'; ctx.font = `700 38px ${FONT}`; ctx.fillText(tip.sub, cx + 230, cy + 145, cw - 280);
    // check
    const cp = easeBack(prog(t, t0 + .45, t0 + .75));
    if (cp > 0) {
      ctx.save(); ctx.translate(cx + cw - 10, cy + 20); ctx.scale(cp, cp);
      ctx.fillStyle = '#2FBF5B'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-4, 11); ctx.lineTo(15, -11); ctx.stroke();
      ctx.restore();
    }
    ctx.textAlign = 'left';
  });
}

/* ============================================================
   ESCENA 7 — Final
   ============================================================ */
function scene7(t) {
  background('#2B1B4D', '#5A2A7A', t, { seed: 44, glow: 'rgba(255,210,120,0.25)' });
  // confeti
  const r = rng(808);
  for (let i = 0; i < 70; i++) {
    const x0 = r() * W, sp = 200 + r() * 300, ph = r() * H, col = ['#FFD23F', '#6FD3FF', '#FF7FB5', '#9CFF9A', '#FFFFFF'][i % 5];
    const y = (ph + t * sp) % (H + 100) - 50, x = x0 + Math.sin(t * 2 + i) * 40;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 4 + i); ctx.fillStyle = col; ctx.fillRect(-9, -5, 18, 10); ctx.restore();
  }
  const p = easeBack(prog(t, 0, .6));
  drawOnion(540, 1030, 300 * p, { t, face: true, mood: 'happy', tears: 0, scale: 300, sx: 1 + Math.sin(t * 6) * .02, sy: 1 - Math.sin(t * 6) * .02 });
  // una lagrimita de felicidad
  if (t > .8) drop(540 + 300 * .4, 1030 + 300 * .05 + ((t - .8) * 120 % 200), 14, .9);
  caption('No estás triste...', 540, 300, t, 0.3, { size: 84 });
  caption('¡es *química*!', 540, 420, t, 0.9, { size: 110, hl: '#9CFF9A' });
  caption('Sígueme para más *curiosidades*', 540, 1470, t, 1.7, { size: 60, hl: '#FFD23F' });
}

/* ============================================================
   Composición y transiciones
   ============================================================ */
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  let i = SCENES.findIndex(s => t >= s.start && t < s.end);
  if (i < 0) i = SCENES.length - 1;
  const sc = SCENES[i];
  const lt = t - sc.start;
  if (i > 0 && lt < TRANS) {
    const prev = SCENES[i - 1];
    ctx.save(); prev.draw(prev.end - prev.start + lt); ctx.restore();
    const k = easeInOut(lt / TRANS);
    ctx.save();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, k * 1150, 0, 7); ctx.clip();
    sc.draw(lt);
    ctx.restore();
    // aro de la transición
    ctx.save(); ctx.lineWidth = 30 * (1 - k); ctx.strokeStyle = '#FFD23F';
    ctx.beginPath(); ctx.arc(W / 2, H / 2, k * 1150, 0, 7); ctx.stroke(); ctx.restore();
  } else {
    ctx.save(); sc.draw(lt); ctx.restore();
  }
  finishFrame();
  // barra de progreso
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = '#FFD23F'; ctx.fillRect(0, 0, W * clamp(t / DURATION), 10);
}
window.draw = draw;
window.DURATION = DURATION;
window.frameJPEG = (t, q) => { draw(t); return cv.toDataURL('image/jpeg', q || 0.93); };

// reproducción en vivo si se abre en un navegador (no durante el render)
if (!location.search.includes('render')) {
  const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
