<template>
  <style>
    #root { position: absolute; inset: 0; background: #2A1A10; }
    #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="film" data-start="0" data-duration="60" data-width="1080" data-height="1920">
    <canvas id="gl" width="1080" height="1920" data-layout-ignore></canvas>
  </div>
  <script>
  (function () {
    /* "¿Por qué tu amigo flaco no engorda?" — escenas 3D (estilo de la cuenta, como el tsunami).
       Modelos compartidos: assets/lib/modelos3d.js (window.M). Cada cuadro depende solo de t. */
    const { THREE, rng, mat, glow, box, ball, cyl, flaco3d, tu3d } = window.M;
    const W = 1080, H = 1920;
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp((t - a) / (b - a));
    const ease = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    function camPath(c, t, keys) { let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++; const [t0, p0, l0] = keys[i], [t1, p1, l1] = keys[Math.min(i + 1, keys.length - 1)]; const k = t1 > t0 ? ease(prog(t, t0, t1)) : 0; c.position.set(lerp(p0[0], p1[0], k), lerp(p0[1], p1[1], k), lerp(p0[2], p1[2], k)); c.lookAt(lerp(l0[0], l1[0], k), lerp(l0[1], l1[1], k), lerp(l0[2], l1[2], k)); }
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1); renderer.setSize(W, H, false);
    renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .82;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const cam = (fov = 36) => new THREE.PerspectiveCamera(fov, W / H, .05, 300);
    function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; }
    function rbox(w, h, d, r, m, x = 0, y = 0, z = 0) {   // caja redondeada (cojines, sillón)
      const s = new THREE.Shape(), hw = w / 2 - r, hh = h / 2 - r;
      s.moveTo(-hw, -h / 2); s.lineTo(hw, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -hh); s.lineTo(w / 2, hh); s.quadraticCurveTo(w / 2, h / 2, hw, h / 2); s.lineTo(-hw, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, hh); s.lineTo(-w / 2, -hh); s.quadraticCurveTo(-w / 2, -h / 2, -hw, -h / 2);
      const g = new THREE.ExtrudeGeometry(s, { depth: d - r * 2, bevelEnabled: true, bevelThickness: r, bevelSize: r * .9, bevelSegments: 4, curveSegments: 6 }); g.translate(0, 0, -(d - r * 2) / 2);
      const m2 = new THREE.Mesh(g, m); m2.position.set(x, y, z); m2.castShadow = m2.receiveShadow = true; return m2;
    }

    /* ---------- utilería ---------- */
    const bagTex = canvasTex(256, 320, (c, w, h) => {
      const g = c.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#C83A2A'); g.addColorStop(.4, '#F25A3A'); g.addColorStop(.65, '#FFC24A'); g.addColorStop(1, '#C8402A'); c.fillStyle = g; c.fillRect(0, 0, w, h);
      c.fillStyle = '#FFF4D6'; c.beginPath(); c.ellipse(128, 190, 80, 58, 0, 0, 7); c.fill();
      c.fillStyle = '#F2C04A'; c.beginPath(); c.ellipse(128, 190, 52, 34, .2, 0, 7); c.fill(); c.fillStyle = 'rgba(190,110,40,.5)'; for (const [a, b] of [[110, 180], [140, 175], [130, 202]]) { c.beginPath(); c.arc(a, b, 5, 0, 7); c.fill(); }
      c.fillStyle = '#FFFFFF'; c.font = '900 46px Nunito, sans-serif'; c.textAlign = 'center'; c.fillText('PAPITAS', 128, 90);
    });
    function chipBag() {
      const g = new THREE.Group();
      const side = new THREE.MeshStandardMaterial({ color: '#D8402A', roughness: .35, metalness: .35 }), front = new THREE.MeshStandardMaterial({ map: bagTex, roughness: .35, metalness: .3 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(.3, .42, .07), [side, side, side, side, front, front]); body.castShadow = true; g.add(body);
      const puff = ball(.16, side, 0, 0, 0, 14); puff.scale.set(.95, 1.25, .35); g.add(puff);
      for (const y of [.215, -.215]) g.add(box(.31, .03, .04, mat('#E8B040', { metalness: .4, roughness: .4 }), 0, y, 0));
      return g;
    }
    function chip(s = 1) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 6), mat('#F2C04A', { roughness: .6 }));
      m.scale.set(1.3 * s, .25 * s, 1 * s); m.castShadow = true; return m;
    }

    /* ================= SALA ================= */
    function livingRoom(s) {
      s.background = new THREE.Color('#2A1A10');
      const floorT = canvasTex(512, 512, (c, w, h) => { c.fillStyle = '#9A6A44'; c.fillRect(0, 0, w, h); const r = rng(4); for (let y = 0; y < h; y += 64) { c.fillStyle = `rgba(0,0,0,${.08 + r() * .08})`; c.fillRect(0, y, w, 3); for (let x = (y / 64 % 2) * 120; x < w; x += 240) c.fillRect(x, y, 3, 64); } });
      floorT.wrapS = floorT.wrapT = THREE.RepeatWrapping; floorT.repeat.set(4, 4);
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ map: floorT, roughness: .7 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; s.add(fl);
      const wallM = mat('#E8C49A');
      s.add(box(14, 6, .2, wallM, 0, 3, -2.4)); s.add(box(.2, 6, 8, wallM, -4.2, 3, 0)); s.add(box(.2, 6, 8, wallM, 4.2, 3, 0));
      s.add(box(14, .18, .06, mat('#FFF4E2'), 0, .09, -2.28));
      // ventana con cortinas y luz de tarde
      s.add(box(1.5, 1.7, .05, glow('#CFE8F4'), 2.0, 2.45, -2.28)); s.add(box(1.6, .08, .1, mat('#FFFFFF'), 2.0, 3.32, -2.25)); s.add(box(.06, 1.7, .08, mat('#FFFFFF'), 2.0, 2.45, -2.25)); s.add(box(1.6, .06, .08, mat('#FFFFFF'), 2.0, 2.45, -2.25));
      for (const sx of [1.05, 2.95]) { const cu = rbox(.5, 2.1, .12, .05, mat('#D9643E', { roughness: 1 }), sx, 2.35, -2.2); s.add(cu); }
      // cuadro
      s.add(box(1.0, .75, .05, mat('#8A5A34'), -1.9, 2.6, -2.27));
      s.add(box(.86, .61, .02, canvasTexMat('#FFF6E4', c => { c.fillStyle = '#7FB3A0'; c.beginPath(); c.moveTo(10, 150); c.lineTo(80, 60); c.lineTo(120, 110); c.lineTo(160, 70); c.lineTo(246, 150); c.fill(); c.fillStyle = '#F2C230'; c.beginPath(); c.arc(200, 40, 20, 0, 7); c.fill(); }), -1.9, 2.6, -2.24));
      // lámpara de pie
      const lamp = new THREE.Group(); lamp.position.set(-3.3, 0, -1.5); s.add(lamp);
      const pole = cyl(.03, .03, 1.7, mat('#3A2A1A'), 8); pole.position.y = .85; lamp.add(pole);
      const shade = cyl(.22, .36, .4, mat('#F6E2B8', { emissive: '#7A5A30', emissiveIntensity: .5 }), 18); shade.position.y = 1.8; lamp.add(shade);
      const lampL = new THREE.PointLight('#FFC880', 1.2, 7, 2); lampL.position.set(-3.3, 1.7, -1.3); s.add(lampL);
      // tapete
      const rug = new THREE.Mesh(new THREE.CircleGeometry(2.0, 40), mat('#C86A4A', { roughness: 1 })); rug.rotation.x = -Math.PI / 2; rug.position.set(0, .01, .9); rug.scale.set(1.4, 1, .7); rug.receiveShadow = true; s.add(rug);
      // luces
      const sun = new THREE.DirectionalLight('#FFD9A8', .85); sun.position.set(4, 7, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 }); s.add(sun);
      s.add(new THREE.HemisphereLight('#FFE8D0', '#5A3A24', .38));
    }
    function canvasTexMat(bg, draw) { return new THREE.MeshStandardMaterial({ map: canvasTex(256, 180, (c, w, h) => { c.fillStyle = bg; c.fillRect(0, 0, w, h); draw(c); }), roughness: .8 }); }
    function couch(s) {
      const g = new THREE.Group(); s.add(g); g.position.set(0, 0, -1.25);
      const m = mat('#3E7F86', { roughness: .95 }), m2 = mat('#356E74', { roughness: .95 });
      g.add(rbox(3.4, .42, 1.0, .1, m2, 0, .21, 0));
      for (const x of [-.82, .82]) g.add(rbox(1.62, .22, .92, .1, m, x, .52, .05));
      g.add(rbox(3.4, .95, .32, .12, m, 0, .85, -.42));
      for (const x of [-1.85, 1.85]) g.add(rbox(.36, .72, 1.0, .12, m, x, .5, 0));
      return g;
    }
    function coffeeTable(s, x, z) {
      const g = new THREE.Group(); g.position.set(x, 0, z); s.add(g);
      g.add(rbox(1.8, .1, .8, .03, mat('#A87448', { roughness: .5 }), 0, .45, 0));
      for (const [a, b] of [[-.8, -.32], [.8, -.32], [-.8, .32], [.8, .32]]) g.add(box(.07, .42, .07, mat('#5A3A22'), a, .21, b));
      return g;
    }
    function bowl(s, x, z) { const b = new THREE.Mesh(new THREE.SphereGeometry(.2, 20, 10, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat('#E8E0D0', { side: THREE.DoubleSide })); b.position.set(x, .7, z); s.add(b); return b; }

    /* escena 1: el flaco se acaba la bolsa; tú, una papita y te miras la panza */
    const S1 = (() => {
      const s = new THREE.Scene(); livingRoom(s); couch(s); coffeeTable(s, 0, .25);
      const f = flaco3d(), u = tu3d(); s.add(f, u);
      f.position.set(-.85, 0, -1.05); u.position.set(.85, 0, -1.05);
      f.userData.sit(.62); u.userData.sit(.62);
      const bag = chipBag(); s.add(bag);
      const ch = chip(1.2); s.add(ch); const ch2 = chip(1.1); s.add(ch2);
      const camera = cam(44);
      function update(t) {
        const F = f.userData, U = u.userData;
        // el flaco: bolsa en la mano izquierda, papas a la boca con la derecha (ritmo de botana)
        F.armL.rotation.set(-.9, 0, .25); F.elbowL.rotation.x = -.6;
        const cyc = (t * 1.5) % 1, up = Math.sin(cyc * Math.PI);
        F.armR.rotation.set(-.4 - up * .9, 0, -.15); F.elbowR.rotation.x = -.4 - up * 1.6;
        F.mouth(up > .65 ? 'open' : 'chew', .5 + .5 * Math.sin(t * 18)); F.brows(0); F.look(.2, -.3);
        F.head.rotation.set(-.05 + up * .08, .15, 0);
        f.updateMatrixWorld(true);
        F.handL.getWorldPosition(bag.position); bag.position.y += .14; bag.position.z += .05; bag.rotation.set(-.15, .25, -.2);
        F.handR.getWorldPosition(ch.position); ch.visible = up > .15; ch.rotation.set(t * 4, t * 3, 0);
        // tú: una sola papita y luego miras tu panza
        const lookDown = ease(prog(t, 2.2, 2.9));
        U.armR.rotation.set(-.8, 0, -.1); U.elbowR.rotation.x = -.9;
        U.armL.rotation.set(-.2, 0, .1); U.elbowL.rotation.x = -.5;
        U.head.rotation.set(lookDown * .45, -.1 * (1 - lookDown), 0); U.look(-.3 * (1 - lookDown), -lookDown);
        U.brows(lookDown); U.mouth(lookDown > .5 ? 'flat' : 'smile');
        u.updateMatrixWorld(true); U.handR.getWorldPosition(ch2.position); ch2.rotation.set(.3, 0, .4);
        camPath(camera, t, [[0, [0, 3.1, 7.2], [0, 1.05, -1]], [8, [0, 2.9, 6.3], [0, 1.1, -1]]]);
        return {};
      }
      return { scene: s, camera, update };
    })();

    /* ================= BAÑO Y BÁSCULA ================= */
    const S2 = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#BFD8DC');
      const tileT = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#E2F2F4'; c.fillRect(0, 0, w, h); c.strokeStyle = '#A8C8CE'; c.lineWidth = 4; for (let i = 0; i <= 4; i++) { c.beginPath(); c.moveTo(i * 64, 0); c.lineTo(i * 64, h); c.stroke(); c.beginPath(); c.moveTo(0, i * 64); c.lineTo(w, i * 64); c.stroke(); } });
      tileT.wrapS = tileT.wrapT = THREE.RepeatWrapping; tileT.repeat.set(5, 3);
      const tw = new THREE.Mesh(new THREE.PlaneGeometry(10, 6), new THREE.MeshStandardMaterial({ map: tileT, roughness: .4 })); tw.position.set(0, 3, -1.6); s.add(tw);
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(10, 8), mat('#9AB0B8', { roughness: .5 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; s.add(fl);
      const sc = rbox(.9, .09, .9, .04, mat('#F4F6F8', { roughness: .3 }), 0, .05, 0); s.add(sc);
      const sun = new THREE.DirectionalLight('#FFF0DC', .85); sun.position.set(3, 6, 5); sun.castShadow = true; s.add(sun);
      s.add(new THREE.HemisphereLight('#FFFFFF', '#6A7A80', .4));
      const u = tu3d(); s.add(u); u.position.set(0, .1, 0);
      const camera = cam(44);
      function update(t) {
        const U = u.userData; U.stand();
        U.armL.rotation.set(.05, 0, .18); U.armR.rotation.set(.05, 0, -.18); U.elbowL.rotation.x = U.elbowR.rotation.x = -.15;
        const shock = t > 2.0; U.head.rotation.set(.38, 0, 0); U.look(0, -1); U.brows(shock ? .6 : .9); U.mouth(shock ? 'o' : 'flat');
        u.position.y = .1 + (t > 1.4 && t < 1.7 ? Math.sin((t - 1.4) / .3 * Math.PI) * .03 : 0);
        camPath(camera, t, [[0, [0, 2.3, 6.6], [0, 1.05, 0]], [8, [0, 2.1, 5.8], [0, 1.1, 0]]]);
        return {};
      }
      return { scene: s, camera, update };
    })();
    /* interior del cuerpo para la lupa: sal y agua */
    const INSET = (() => {
      const s = new THREE.Scene(); s.background = new THREE.Color('#E89A86');
      s.add(new THREE.HemisphereLight('#FFFFFF', '#C87860', .55)); const k = new THREE.DirectionalLight('#FFFFFF', .7); k.position.set(2, 3, 4); s.add(k);
      const r = rng(9), salts = [], drops = [];
      for (let i = 0; i < 6; i++) { const c = new THREE.Mesh(new THREE.BoxGeometry(.32, .32, .32), mat('#FFFFFF', { roughness: .25 })); c.position.set((r() - .5) * 2.2, (r() - .5) * 2.2, (r() - .5) * .6); c.rotation.set(r() * 3, r() * 3, 0); s.add(c); salts.push(c); }
      const dm = new THREE.MeshStandardMaterial({ color: '#5AB8FF', roughness: .1, metalness: .1, transparent: true, opacity: .85 });
      for (let i = 0; i < 26; i++) { const d = new THREE.Group(); const b = new THREE.Mesh(new THREE.SphereGeometry(.1, 14, 10), dm); const c = new THREE.Mesh(new THREE.ConeGeometry(.085, .16, 14), dm); c.position.y = .12; d.add(b, c); const sc = .8 + r() * .7; d.scale.setScalar(sc); s.add(d); drops.push({ d, a: r() * 7, rad: .6 + r() * 1.0, sp: .3 + r() * .4, y: (r() - .5) * .5 }); }
      const camera = new THREE.PerspectiveCamera(40, 1, .1, 50); camera.position.set(0, 0, 4); camera.lookAt(0, 0, 0);
      function update(t) { salts.forEach((c, i) => c.rotation.y = t * .3 + i); drops.forEach(o => { const a = o.a + t * o.sp; o.d.position.set(Math.cos(a) * o.rad, Math.sin(a) * o.rad * .9 + o.y, Math.sin(a * 2) * .3); }); }
      return { scene: s, camera, update };
    })();
    const rtInset = new THREE.WebGLRenderTarget(512, 512, { samples: 4 });

    /* ================= SECRETO 1: se mueve sin darse cuenta ================= */
    const S4 = (() => {
      const s = new THREE.Scene(); livingRoom(s); couch(s); coffeeTable(s, .7, .25); bowl(s, 1.0, .25);
      const f = flaco3d(), u = tu3d(); s.add(f, u);
      u.position.set(.95, 0, -1.05); u.userData.sit(.62);
      const ph = box(.08, .16, .015, mat('#1A1A22', { roughness: .3 })); s.add(ph);
      const camera = cam(44);
      function update(t) {
        const F = f.userData, U = u.userData;
        const walk = t * 5.5, x = -1.0 + Math.sin(t * .7) * .55;
        f.position.set(x, Math.abs(Math.sin(walk)) * .03, .3); f.rotation.y = Math.cos(t * .7) > 0 ? .5 : -.5;
        F.legL.rotation.x = Math.sin(walk) * .45; F.legR.rotation.x = -Math.sin(walk) * .45; F.kneeL.rotation.x = Math.max(0, -Math.sin(walk)) * .6; F.kneeR.rotation.x = Math.max(0, Math.sin(walk)) * .6;
        // teléfono en la oreja izquierda; la otra mano gesticula
        F.armL.rotation.set(-.35, 0, .9); F.elbowL.rotation.x = -2.4;
        F.armR.rotation.set(-.5 + Math.sin(t * 4) * .35, 0, -.3 - Math.sin(t * 3) * .15); F.elbowR.rotation.x = -.8 - Math.sin(t * 4) * .4;
        F.mouth(Math.sin(t * 11) > 0 ? 'open' : 'smile'); F.head.rotation.set(0, -.2, .1); F.look(.4, 0);
        f.updateMatrixWorld(true); F.handL.getWorldPosition(ph.position); ph.quaternion.copy(f.quaternion); ph.rotateY(Math.PI / 2);
        U.armL.rotation.set(-.3, 0, .1); U.armR.rotation.set(-.2, 0, -.1); U.head.rotation.set(0, -.35, 0); U.look(-.8, 0); U.mouth('smile');
        camPath(camera, t, [[0, [0, 3.0, 7.6], [-.2, 1.1, -.6]], [10, [0, 2.8, 6.8], [-.2, 1.15, -.6]]]);
        return {};
      }
      return { scene: s, camera, update };
    })();

    /* ================= composición: grano, viñeta, lupa ================= */
    const SC = [{ a: 0, b: 8, s: S1 }, { a: 8, b: 16, s: S2 }, { a: 16, b: 60, s: S4 }];
    const rtA = new THREE.WebGLRenderTarget(W, H, { samples: 4 });
    const post = new THREE.ShaderMaterial({
      uniforms: { a: { value: rtA.texture }, ins: { value: rtInset.texture }, insK: { value: 0 }, insC: { value: new THREE.Vector3(.70, .57, .19) }, frame: { value: 0 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
      fragmentShader: `uniform sampler2D a, ins; uniform float insK, frame; uniform vec3 insC; varying vec2 vUv;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
        void main(){
          vec3 c = texture2D(a, vUv).rgb;
          // lupa: círculo con el interior del cuerpo
          vec2 p = (vUv - insC.xy) * vec2(1080., 1920.) / 1080.; float r = insC.z * insK, d = length(p);
          if (insK > 0. && d < r) { vec2 q = p / r * .5 + .5; c = texture2D(ins, q).rgb; }
          vec2 m = vUv - .5; c *= 1. - smoothstep(.38, .9, length(m * vec2(1., .6))) * .45;
          c = mix(c, c * vec3(1.06, 1.0, .9), .5);
          c += (hash(vUv * vec2(1080., 1920.) + frame * 17.) - .5) * .03;
          gl_FragColor = vec4(max(c, 0.), 1.);
          #include <tonemapping_fragment>
          #include <encodings_fragment>
        }`, depthTest: false, depthWrite: false });
    const postScene = new THREE.Scene(); postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post)); const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    window.__PAP = { insetK: t => (t >= 8 && t < 16) ? ease(prog(t - 8, 3.0, 3.8)) : 0 };
    function renderAt(t) {
      const c = SC.find(x => t >= x.a && t < x.b) || SC[SC.length - 1];
      c.s.update(t - c.a); renderer.setRenderTarget(rtA); renderer.render(c.s.scene, c.s.camera);
      const k = window.__PAP.insetK(t);
      if (k > 0) { INSET.update(t); renderer.setRenderTarget(rtInset); renderer.render(INSET.scene, INSET.camera); }
      post.uniforms.insK.value = k; post.uniforms.frame.value = Math.round(t * 30);
      renderer.setRenderTarget(null); renderer.render(postScene, postCam);
    }
    window.addEventListener('hf-seek', e => renderAt(e.detail.time));
    renderAt(0);
    window.__timelines = window.__timelines || {};
    window.__timelines['film'] = gsap.timeline({ paused: true });
  })();
  </script>
</template>
