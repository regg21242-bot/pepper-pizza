<template>
  <style>
    #root { position: absolute; inset: 0; background: #F4E6D0; }
    #film-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="film" data-start="0" data-duration="60" data-width="1080" data-height="1920">
    <canvas id="film-canvas" width="1080" height="1920" data-layout-ignore></canvas>
  </div>
  <script>
  (function () {
    const cv = document.getElementById('film-canvas'), main = cv.getContext('2d'); let ctx = main;
    const W = 1080, H = 1920;
    const { setCtx, shade, soft: soft0, flaco, tu, chipBag, chip, couch, energyBar, coffeeTable } = window.P2;
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp((t - a) / (b - a));
    const ease = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const use = c => { ctx = c; setCtx(c); };
    function soft(fn, blur, alpha = 1) { ctx.save(); ctx.filter = `blur(${blur}px)`; ctx.globalAlpha *= alpha; fn(); ctx.restore(); }
    function radial(x, y, r, stops) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
    /* grano fino + viñeta + oscurecido arriba para los subtítulos */
    const grain = document.createElement('canvas'); grain.width = 540; grain.height = 960;
    (function () { const g = grain.getContext('2d'), im = g.createImageData(540, 960), r = rng(11); for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - .5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); })();
    function finish(t) {
      const f = Math.floor(t * 30);
      ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .13; ctx.drawImage(grain, -(f * 37) % 540, -(f * 61) % 960, W * 2, H * 2); ctx.restore();
      const tg = ctx.createLinearGradient(0, 0, 0, 520); tg.addColorStop(0, 'rgba(30,15,5,0.45)'); tg.addColorStop(1, 'rgba(30,15,5,0)'); ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 520);
      ctx.fillStyle = radial(W / 2, H * .48, H * .78, [[0, 'rgba(40,20,10,0)'], [.6, 'rgba(40,20,10,0)'], [1, 'rgba(40,20,10,0.45)']]); ctx.fillRect(0, 0, W, H);
    }

    /* ===================== SALA ===================== */
    function livingRoom(t) {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#F2D9B6'); g.addColorStop(.62, '#E8C59A'); g.addColorStop(.62, '#9A6A44'); g.addColorStop(1, '#7A5234');
      ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
      // ventana con cortinas
      ctx.fillStyle = '#BFE0F0'; ctx.beginPath(); ctx.roundRect(640, 330, 320, 380, 12); ctx.fill(); ctx.lineWidth = 10; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(800, 330); ctx.lineTo(800, 710); ctx.moveTo(640, 520); ctx.lineTo(960, 520); ctx.stroke();
      for (const [x, d] of [[620, 1], [980, -1]]) { ctx.fillStyle = '#D96A4A'; ctx.beginPath(); ctx.moveTo(x, 300); ctx.quadraticCurveTo(x + d * 40, 520, x + d * 10, 760); ctx.lineTo(x - d * 50, 760); ctx.quadraticCurveTo(x - d * 30, 520, x - d * 40, 300); ctx.closePath(); ctx.fill(); }
      // cuadro y lámpara
      ctx.fillStyle = '#FFF6E4'; ctx.beginPath(); ctx.roundRect(110, 360, 260, 200, 8); ctx.fill(); ctx.lineWidth = 12; ctx.strokeStyle = '#8A5A34'; ctx.stroke();
      ctx.fillStyle = '#7FB3A0'; ctx.beginPath(); ctx.moveTo(130, 540); ctx.lineTo(210, 440); ctx.lineTo(260, 500); ctx.lineTo(300, 460); ctx.lineTo(350, 540); ctx.fill();
      ctx.fillStyle = '#F2C230'; ctx.beginPath(); ctx.arc(320, 410, 24, 0, 7); ctx.fill();
      ctx.fillStyle = radial(80, 820, 340, [[0, 'rgba(255,220,150,0.5)'], [1, 'rgba(255,220,150,0)']]); ctx.fillRect(-200, 400, 700, 900);
      // tapete
      ctx.fillStyle = '#C86A4A'; ctx.beginPath(); ctx.ellipse(540, 1560, 520, 140, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,230,200,0.5)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.ellipse(540, 1560, 470, 112, 0, 0, 7); ctx.stroke();
      // tablas del piso
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 3; for (let y = 1220; y < H; y += 70) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }
    /* escena 1: el flaco se acaba la bolsa; tú, una sola papa y te preocupas */
    function scene1(t) {
      livingRoom(t);
      const z = 1 + t * .01; ctx.save(); ctx.translate(540, 1100); ctx.scale(z, z); ctx.translate(-540, -1100);
      couch(540, 1180, 980);
      // el flaco (izquierda)
      const eatK = (t * 1.6) % 1, toMouth = Math.sin(eatK * Math.PI);
      const f = flaco(320, 1130, 1.0, { expr: toMouth > .6 ? 'chew' : 'happy', t, armL: [.5, -1.2], armR: [-.4 - toMouth * 1.5, -1.4 - toMouth * .7], look: [.4, -.2] });
      chipBag(f.handL[0] + 30, f.handL[1] - 40, .72, -.25, 1);
      if (toMouth > .2) chip(f.handR[0], f.handR[1] - 10, .85, t * 3);
      // tú (derecha): una papita y miras tu panza
      const look = prog(t, 2.2, 2.8);
      const u = tu(750, 1140, .98, { expr: look > .5 ? 'worried' : 'smile', armL: [-.25, -.9], armR: [-.6, -1.6], look: [lerp(.6, -.2, look), lerp(0, 1, look)], tilt: look * .12 });
      chip(u.handR[0], u.handR[1] - 12, .7, .4);
      // gota de nervios
      coffeeTable(540, 1238, 760, () => { ctx.fillStyle = '#E8E0D0'; ctx.beginPath(); ctx.ellipse(170, -18, 60, 14, 0, 0, 7); ctx.fill(); });
      if (look > .5) { ctx.fillStyle = '#9AD8FF'; ctx.beginPath(); const sx = u.head[0] + 100, sy = u.head[1] - 40 + ((t * 30) % 20); ctx.moveTo(sx, sy - 20); ctx.quadraticCurveTo(sx + 14, sy, sx, sy + 10); ctx.quadraticCurveTo(sx - 14, sy, sx, sy - 20); ctx.fill(); }
      ctx.restore();
    }

    /* ===================== BAÑO Y BÁSCULA ===================== */
    function bathroom() {
      ctx.fillStyle = '#DCEFF2'; ctx.fillRect(-W, -H, W * 3, H * 3);
      ctx.strokeStyle = 'rgba(120,170,180,0.35)'; ctx.lineWidth = 3;
      for (let y = 0; y < 1300; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      for (let x = 0; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1300); ctx.stroke(); }
      const fl = ctx.createLinearGradient(0, 1300, 0, H); fl.addColorStop(0, '#B8C8D0'); fl.addColorStop(1, '#8EA0AA'); ctx.fillStyle = fl; ctx.fillRect(-W, 1300, W * 3, H);
      ctx.fillStyle = radial(540, 600, 700, [[0, 'rgba(255,250,230,0.5)'], [1, 'rgba(255,250,230,0)']]); ctx.fillRect(0, 0, W, H);
    }
    function scale(x, y, s, val, t) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      soft(() => { ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0, 60, 230, 30, 0, 0, 7); ctx.fill(); }, 12);
      ctx.beginPath(); ctx.roundRect(-210, -30, 420, 90, 34); const g = ctx.createLinearGradient(0, -30, 0, 60); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, '#C8D0D8'); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,60,80,0.5)'; ctx.stroke();
      ctx.restore();
    }
    function scaleDisplay(x, y, s, val, up) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.fillStyle = '#1A2A30'; ctx.beginPath(); ctx.roundRect(-150, -60, 300, 120, 22); ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      ctx.fillStyle = '#7AF2C8'; ctx.font = '700 72px "Space Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(val, -12, 4);
      ctx.font = '700 28px Nunito, sans-serif'; ctx.fillText('kg', 118, 22);
      if (up > 0) { ctx.globalAlpha = up; ctx.fillStyle = '#FF6A4A'; ctx.beginPath(); ctx.moveTo(170, 10); ctx.lineTo(200, -30); ctx.lineTo(230, 10); ctx.closePath(); ctx.fill(); ctx.fillRect(190, 10, 20, 30); }
      ctx.restore();
    }
    /* el "interior": sal y agua (no grasa) */
    function saltCrystal(x, y, s, rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(26, -15); ctx.lineTo(26, 15); ctx.lineTo(0, 30); ctx.lineTo(-26, 15); ctx.lineTo(-26, -15); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#E2ECF2'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(26, -15); ctx.lineTo(26, 15); ctx.lineTo(0, 30); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#C8D6E0'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.lineTo(-26, 15); ctx.lineTo(-26, -15); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(80,100,120,0.5)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
    function drop(x, y, r) {
      ctx.beginPath(); ctx.moveTo(x, y - r * 1.9); ctx.bezierCurveTo(x + r * .4, y - r, x + r, y - r * .5, x + r, y + r * .1); ctx.arc(x, y + r * .1, r, 0, Math.PI); ctx.bezierCurveTo(x - r, y - r * .5, x - r * .4, y - r, x, y - r * 1.9);
      const g = ctx.createRadialGradient(x - r * .3, y - r * .2, r * .1, x, y, r * 1.6); g.addColorStop(0, '#E8F8FF'); g.addColorStop(.5, '#6FC8FF'); g.addColorStop(1, '#2F84D8');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(20,70,140,0.5)'; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .2, r * .16, r * .28, -.5, 0, 7); ctx.fill();
    }
    function fatCell(x, y, r, o = {}) {
      const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); g.addColorStop(0, '#FFF6C0'); g.addColorStop(.6, '#F7D45A'); g.addColorStop(1, '#D8A830');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(150,100,20,0.55)'; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .4, r * .22, r * .12, -.6, 0, 7); ctx.fill();
    }
    function tagLabel(text, x, y, bg = '#FFFFFF', fg = '#1A2A30', size = 40) {
      ctx.save(); ctx.font = `900 ${size}px Nunito, sans-serif`; const w = ctx.measureText(text).width + 46, h = size * 1.5;
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,30,40,0.6)'; ctx.stroke();
      ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 2); ctx.restore();
    }
    function scene2(t) {
      bathroom();
      const z = 1 + t * .012; ctx.save(); ctx.translate(540, 1100); ctx.scale(z, z); ctx.translate(-540, -1100);
      scale(540, 1660, 1.15, '', t);
      const u = tu(540, 1370, .95, { pose: 'stand', expr: t > 2 ? 'shock' : 'worried', armL: [.25, .1], armR: [-.25, -.1], look: [0, 1] });
      ctx.restore();
      const up = prog(t, 1.4, 2.0), val = (72.4 + up * .7).toFixed(1);
      scaleDisplay(300, 560, 1, val, up);
      // lupa: dentro del cuerpo
      const mk = ease(prog(t, 3.0, 3.8));
      if (mk > 0) {
        const cx = 740, cy = 760, R = 210 * mk;
        ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.clip();
        ctx.fillStyle = radial(cx, cy, R, [[0, '#FFE2D0'], [1, '#F2B8A0']]); ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
        const r = rng(5);
        for (let i = 0; i < 5; i++) { const a = i * 1.25 + .3, d = 70 + r() * 60; saltCrystal(cx + Math.cos(a) * d * .9, cy + Math.sin(a) * d * .8, .9, r() * .6); }
        for (let i = 0; i < 16; i++) { const a = i / 16 * 7 + t * .5, d = 40 + (i % 4) * 38 + Math.sin(t * 2 + i) * 6; drop(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 13 + (i % 3) * 4); }
        ctx.restore();
        ctx.lineWidth = 14; ctx.strokeStyle = '#2A3A44'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
        ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx + R * .25, cy + R * .97); ctx.lineTo(cx + R * .36, cy + R * 1.35); ctx.stroke();
        // rayita que conecta la lupa con la panza
        ctx.setLineDash([12, 10]); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(42,58,68,0.6)'; ctx.beginPath(); ctx.moveTo(cx - R * .7, cy + R * .7); ctx.lineTo(560, 1260); ctx.stroke(); ctx.setLineDash([]);
        if (mk > .9) { tagLabel('SAL', cx - 110, cy - 240, '#FFFFFF'); tagLabel('AGUA', cx + 90, cy - 240, '#6FC8FF'); }
        // "grasa nueva: 0"
        if (t > 4.2) { fatCell(220, 860, 52); ctx.strokeStyle = '#E2453A'; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(220, 860, 74, 0, 7); ctx.moveTo(168, 808); ctx.lineTo(272, 912); ctx.stroke(); tagLabel('grasa nueva: 0', 230, 980, '#FFF6D0', '#5A3A10', 34); }
      }
    }

    /* ===================== SECRETO 1: se mueve sin darse cuenta ===================== */
    function phone(x, y, s, rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.fillStyle = '#1A1A22'; ctx.beginPath(); ctx.roundRect(-22, -42, 44, 84, 8); ctx.fill(); ctx.fillStyle = '#5AB0FF'; ctx.fillRect(-17, -34, 34, 66); ctx.restore(); }
    function scene4(t) {
      livingRoom(t);
      const z = 1.05 + t * .01; ctx.save(); ctx.translate(540, 1100); ctx.scale(z, z); ctx.translate(-540, -1100);
      couch(540, 1180, 980);
      // tú sentado, mirando
      tu(780, 1140, .9, { expr: 'smile', armL: [-.2, -.6], armR: [.2, .5], look: [-1, 0] });
      coffeeTable(700, 1238, 640);
      // el flaco de pie, caminando con el teléfono y moviendo la mano libre
      const x = 330 + Math.sin(t * .9) * 60, walk = t * 6;
      const f = flaco(x, 1350, 1.0, { pose: 'stand', walk, bob: Math.abs(Math.sin(walk)) * 6, expr: 'grin', armL: [-2.6, 3.75], armR: [-.4 + Math.sin(t * 4) * .5, -1.0 + Math.sin(t * 4) * .4], look: [.6, 0] });
      phone(f.handL[0] + 8, f.handL[1] - 6, 1.1, .3);
      // líneas de movimiento
      ctx.strokeStyle = 'rgba(80,50,20,0.5)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) { const yy = 1180 + i * 60, ph = (t * 3 + i * .3) % 1; ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(x - 140 - ph * 40, yy); ctx.lineTo(x - 210 - ph * 40, yy); ctx.stroke(); }
      ctx.globalAlpha = 1;
      // barra de energía sobre el flaco: se va vaciando
      const k = 1 - .65 * prog(t, 0, 9);
      energyBar(350, 450, 380, k);
      // contador de calorías gastadas
      ctx.fillStyle = '#FFFFFF'; ctx.font = '900 46px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(40,20,10,0.7)';
      const kc = Math.round(prog(t, 0, 9) * 350), txt = `−${kc} kcal`; ctx.strokeText(txt, 540, 580); ctx.fillText(txt, 540, 580);
      ctx.restore();
    }

    const SCENES = [{ a: 0, b: 8, fn: scene1 }, { a: 8, b: 16, fn: scene2 }, { a: 16, b: 60, fn: scene4 }];
    function renderAt(t) {
      use(main); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
      const s = SCENES.find(x => t >= x.a && t < x.b) || SCENES[SCENES.length - 1];
      ctx.clearRect(0, 0, W, H); s.fn(t - s.a); finish(t);
    }
    window.addEventListener('hf-seek', e => renderAt(e.detail.time));
    renderAt(0);
    window.__timelines = window.__timelines || {};
    window.__timelines['film'] = gsap.timeline({ paused: true });
  })();
  </script>
</template>
