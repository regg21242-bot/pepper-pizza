<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #hud-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="hud" data-start="0" data-duration="60" data-width="1080" data-height="1920">
    <canvas id="hud-canvas" width="1080" height="1920" data-layout-ignore></canvas>
  </div>
  <script>
  (function () {
    /* capa 2D encima del 3D: báscula, lupa, etiquetas, barra de energía, contadores */
    const cv = document.getElementById('hud-canvas'), ctx = cv.getContext('2d'), W = 1080, H = 1920;
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), prog = (t, a, b) => clamp((t - a) / (b - a));
    const ease = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    const back = k => { k = clamp(k); const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
    function tag(text, x, y, bg = '#FFFFFF', fg = '#1A2A30', size = 40, k = 1) {
      if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.font = `900 ${size}px Nunito, sans-serif`; const w = ctx.measureText(text).width + 46, h = size * 1.5;
      ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,30,40,0.6)'; ctx.stroke();
      ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 2); ctx.restore();
    }
    function scaleDisplay(x, y, val, up, k) {
      if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
      ctx.fillStyle = '#1A2A30'; ctx.beginPath(); ctx.roundRect(-160, -64, 320, 128, 24); ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      ctx.fillStyle = '#7AF2C8'; ctx.font = '700 76px "Space Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(val, -14, 4);
      ctx.font = '800 30px Nunito, sans-serif'; ctx.fillText('kg', 124, 24);
      if (up > 0) { ctx.globalAlpha = up; ctx.fillStyle = '#FF6A4A'; ctx.beginPath(); ctx.moveTo(182, 10); ctx.lineTo(214, -34); ctx.lineTo(246, 10); ctx.closePath(); ctx.fill(); ctx.fillRect(203, 10, 22, 32); }
      ctx.restore();
    }
    function fatCell(x, y, r) {
      const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); g.addColorStop(0, '#FFF6C0'); g.addColorStop(.6, '#F7D45A'); g.addColorStop(1, '#D8A830');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(150,100,20,0.55)'; ctx.stroke();
    }
    function energyBar(x, y, w, k, label = 'ENERGÍA') {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = 'rgba(20,20,30,0.85)'; ctx.beginPath(); ctx.roundRect(-8, -8, w + 16, 66, 14); ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4; ctx.stroke();
      const n = 10, sw = (w - 18) / n;
      for (let i = 0; i < n; i++) { const on = i / n < k; ctx.fillStyle = on ? (k > .5 ? '#5BE36A' : k > .25 ? '#F2C230' : '#F2563A') : 'rgba(255,255,255,0.12)'; ctx.fillRect(4 + i * sw, 4, sw - 4, 42); }
      ctx.fillStyle = '#FFF'; ctx.font = '900 32px Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(30,20,10,0.7)'; ctx.strokeText('⚡ ' + label, 0, -24); ctx.fillText('⚡ ' + label, 0, -24);
      ctx.restore();
    }
    function outlineText(t, x, y, size, col = '#FFFFFF') { ctx.font = `900 ${size}px Nunito, sans-serif`; ctx.textAlign = 'center'; ctx.lineWidth = size * .2; ctx.strokeStyle = 'rgba(40,20,10,0.75)'; ctx.strokeText(t, x, y); ctx.fillStyle = col; ctx.fillText(t, x, y); }
    function renderAt(t) {
      ctx.clearRect(0, 0, W, H);
      if (t >= 8 && t < 16) {   // escena 2: báscula y lupa
        const lt = t - 8, up = prog(lt, 1.4, 2.0);
        scaleDisplay(225, 480, (72.4 + up * .7).toFixed(1), up, back(prog(lt, .2, .6)));
        const k = window.__PAP ? window.__PAP.insetK(t) : 0, cx = 756, cy = 826, R = 205 * k;
        if (k > 0) {
          ctx.lineWidth = 16; ctx.strokeStyle = '#2A3A44'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
          ctx.lineWidth = 28; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx + R * .25, cy + R * .97); ctx.lineTo(cx + R * .34, cy + R * 1.35); ctx.stroke();
          ctx.setLineDash([12, 10]); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(42,58,68,0.6)'; ctx.beginPath(); ctx.moveTo(cx - R * .7, cy + R * .7); ctx.lineTo(560, 1180); ctx.stroke(); ctx.setLineDash([]);
          tag('SAL', cx - 100, cy + 300, '#FFFFFF', '#1A2A30', 40, back(prog(lt, 3.8, 4.1)));
          tag('AGUA', cx + 90, cy + 300, '#6FC8FF', '#0A2A4A', 40, back(prog(lt, 4.0, 4.3)));
        }
        const g = back(prog(lt, 4.4, 4.8));
        if (g > 0) { ctx.save(); ctx.translate(200, 900); ctx.scale(g, g); fatCell(0, 0, 52); ctx.strokeStyle = '#E2453A'; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(0, 0, 74, 0, 7); ctx.moveTo(-52, -52); ctx.lineTo(52, 52); ctx.stroke(); ctx.restore(); tag('grasa nueva: 0', 210, 1020, '#FFF6D0', '#5A3A10', 34, g); }
      }
      if (t >= 16) {   // escena 4: barra de energía que se vacía
        const lt = t - 16, k = 1 - .65 * prog(lt, 0, 9);
        energyBar(350, 450, 380, k);
        outlineText(`−${Math.round(prog(lt, 0, 9) * 350)} kcal`, 540, 580, 48);
      }
    }
    window.addEventListener('hf-seek', e => renderAt(e.detail.time));
    renderAt(0);
    window.__timelines = window.__timelines || {};
    window.__timelines['hud'] = gsap.timeline({ paused: true });
  })();
  </script>
</template>
